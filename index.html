// Foto seleccionada en el formulario de producto (data URL)
let fotoTmp;
function leerFoto(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { fotoTmp = r.result; document.getElementById('fprev').innerHTML = `<img src="${fotoTmp}" alt="">`; };
  r.readAsDataURL(f);
}
function quitarFoto(sku) {
  fotoTmp = null;
  const p = productos.find(x => x.sku === sku) || { cat: '', ilus: 'caja' };
  document.getElementById('fprev').innerHTML = fotoHTML({ ...p, foto: null });
}

// Editor de planes de financiamiento dentro del formulario del artículo
const filaPlan = pl => `<tr class="plan-ed">
  <td><input class="input" type="number" min="1" step="1" data-k="semanas" value="${pl.semanas}" required></td>
  <td><input class="input" type="number" min="0" step="any" data-k="recargo" value="${+(pl.recargo * 100).toFixed(2)}" required></td>
  <td class="num" data-abono>—</td><td class="num" data-total>—</td>
  <td class="num"><button type="button" class="x" title="Quitar plazo" onclick="this.closest('tr').remove();document.getElementById('mf').oninput()">×</button></td></tr>`;
function agregarPlazo() {
  const filas = leerPlanes();
  const ult = filas.at(-1) || { semanas: 4, recargo: 0.05 };
  document.querySelector('#planes tbody').insertAdjacentHTML('beforeend', filaPlan({ semanas: ult.semanas + 4, recargo: ult.recargo + 0.02 }));
  document.getElementById('mf').oninput();
}
function leerPlanes() {
  return [...document.querySelectorAll('#planes .plan-ed')].map(tr => ({
    semanas: Math.round(+tr.querySelector('[data-k=semanas]').value),
    recargo: (+tr.querySelector('[data-k=recargo]').value || 0) / 100,
  }));
}
function vistaPlanes(d) {
  const precio = +d.precio || 0, engPct = (+d.engPct || 0) / 100;
  const enganche = Math.round(precio * engPct / 100) * 100;
  document.getElementById('engMonto').textContent = precio ? `= ${$m(enganche)}` : '';
  document.querySelectorAll('#planes .plan-ed').forEach(tr => {
    const s = Math.round(+tr.querySelector('[data-k=semanas]').value), r = (+tr.querySelector('[data-k=recargo]').value || 0) / 100;
    const ok = precio > 0 && s > 0;
    const k = ok ? planCalc({ precio }, { semanas: s, recargo: r }, enganche) : null;
    tr.querySelector('[data-abono]').innerHTML = k ? `<b style="color:var(--brand-2)">${$m(k.abono)}</b>` : '—';
    tr.querySelector('[data-total]').textContent = k ? $m(k.total) : '—';
  });
  const n = document.querySelectorAll('#planes .plan-ed').length;
  document.getElementById('sinPlanes').style.display = n ? 'none' : 'block';
}

function modalProducto(sku) {
  const p = productos.find(x => x.sku === sku);
  const v = p || { nombre: '', sku: '', cat: 'Línea blanca', costo: '', precio: '', stock: 0, min: 2, desc: '', foto: null, ilus: 'caja', engPct: 0.10, planes: PLANES_BASE };
  fotoTmp = v.foto;
  const cats = [...new Set(productos.map(x => x.cat))];
  openModal(p ? `Editar artículo · ${esc(p.nombre)}` : 'Nuevo artículo', `<div class="detalle">
    <div><div class="fprev" id="fprev">${fotoHTML(v)}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><label class="btn sm" style="flex:1;justify-content:center">Subir foto<input type="file" accept="image/*" hidden onchange="leerFoto(this)"></label><button type="button" class="btn sm" onclick="quitarFoto('${esc(v.sku)}')">Quitar</button></div>
      <span class="sub" style="margin-top:6px">La foto se muestra en el catálogo y en el inventario.</span></div>
    <div class="fgrid">
    ${field('Nombre', `<input class="input" name="nombre" required value="${esc(v.nombre)}">`, true)}
    ${field('SKU', `<input class="input" name="sku" required value="${esc(v.sku)}" ${p ? 'readonly style="background:var(--soft)"' : 'pattern="[A-Za-z0-9._\\-]+" maxlength="20" title="Solo letras, números, guion, punto o guion bajo (sin espacios)" style="text-transform:uppercase"'}>`)}
    ${field('Categoría', `<select class="input" name="cat">${cats.map(c => `<option ${c === v.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>`)}
    ${field('Costo', `<input class="input" type="number" name="costo" required min="0" step="0.01" value="${v.costo}">`)}
    ${field('Precio de venta', `<input class="input" type="number" name="precio" required min="0.01" step="0.01" value="${v.precio}">`)}
    ${p ? '' : field('Existencia inicial', '<input class="input" type="number" name="stock" value="0" min="0">')}
    ${field('Stock mínimo', `<input class="input" type="number" name="min" value="${v.min}" min="0">`)}
    ${field('Descripción para el catálogo', `<textarea class="input" name="desc" rows="3">${esc(v.desc)}</textarea>`, true)}
    </div></div>
    <div class="plan-box">
      <div class="plan-head"><div><b>Plan de financiamiento</b><span class="sub">Plazos que se ofrecen en el catálogo para este artículo</span></div>
        <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="engPct" style="white-space:nowrap">Enganche</label><input class="input" id="engPct" type="number" name="engPct" min="0" max="90" step="any" value="${Math.round(v.engPct * 100)}" style="width:76px"><span class="muted">%</span><span class="muted" id="engMonto" style="white-space:nowrap"></span></div></div>
      <div class="tbl-wrap"><table id="planes"><thead><tr><th>Plazo (semanas)</th><th>Recargo %</th><th class="num">Abono sem.</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>${v.planes.map(filaPlan).join('')}</tbody></table></div>
      <div id="sinPlanes" class="sub" style="padding:10px 0;display:none">Sin plazos: el artículo se venderá solo de contado.</div>
      <button type="button" class="btn sm" style="margin-top:10px" onclick="agregarPlazo()">+ Agregar plazo</button>
    </div>`, d => {
    const planes = leerPlanes().filter(pl => pl.semanas > 0).sort((a, b) => a.semanas - b.semanas);
    if (new Set(planes.map(pl => pl.semanas)).size !== planes.length) { toast('Hay plazos repetidos'); return false; }
    const datos = { nombre: d.nombre.trim(), cat: d.cat, costo: +d.costo, precio: +d.precio, min: +d.min, desc: d.desc, foto: fotoTmp, engPct: (+d.engPct || 0) / 100, planes };
    if (p) {
      Object.assign(p, datos);
      toast('Artículo actualizado');
    } else {
      const sku = d.sku.trim().toUpperCase();
      if (!/^[A-Z0-9._-]+$/.test(sku)) { toast('El SKU solo puede tener letras, números, guion, punto o guion bajo'); return false; }
      if (productos.some(x => x.sku === sku)) { toast('Ese SKU ya existe'); return false; }
      productos.push({ sku, stock: +d.stock, ilus: 'caja', ...datos });
      toast('Artículo agregado al catálogo y al inventario');
    }
  }, vistaPlanes, true);
}

function modalDetalle(sku, freq = 'semanal') {
  const p = productos.find(x => x.sku === sku), agotado = p.stock === 0;
  const planes = p.planes.map(pl => planCalc(p, pl, undefined, freq));
  openModal(esc(p.nombre), `<div class="detalle">
    <div><div class="pimg ${agotado ? 'out' : ''}">${fotoHTML(p)}</div>
      <p style="margin:12px 0 6px">${esc(p.desc) || '<span class="muted">Sin descripción.</span>'}</p>
      <div class="kv"><span>SKU</span><b>${esc(p.sku)}</b></div>
      <div class="kv"><span>Categoría</span><b>${esc(p.cat)}</b></div>
      <div class="kv"><span>Existencia en tienda</span>${agotado ? '<span class="badge b-bad">Agotado</span>' : `<b>${p.stock} pzas</b>`}</div>
      <button type="button" class="btn sm ghost" style="margin:8px 0 0 -10px" onclick="modalProducto('${p.sku}')">Editar artículo, foto y plan</button>
    </div>
    <div>
      <span class="sub">Precio de contado</span><div class="price" style="margin:0 0 12px">${$m(p.precio)}</div>
      <div class="tabs" style="margin-bottom:10px;width:fit-content">${['semanal', 'quincenal'].map(f => `<button type="button" class="tab ${f === freq ? 'on' : ''}" onclick="modalDetalle('${p.sku}','${f}')">Pago ${f}</button>`).join('')}</div>
      <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Plazo</th><th class="num">Enganche</th><th class="num">Abono ${freq === 'quincenal' ? 'quinc.' : 'sem.'}</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${planes.map(pl => `<tr class="plan-row"><td><b>${pl.semanas} sem.</b> <span class="muted" style="font-size:12px">+${Math.round(pl.recargo * 100)}%</span></td><td class="num">${$m(pl.enganche)}</td><td class="num"><b style="color:var(--brand-2)">${$m(pl.abono)}</b><span class="sub">${pl.nPagos} pagos</span></td><td class="num">${$m(pl.total)}</td><td class="num">${agotado ? '' : `<button type="button" class="btn sm" onclick="modalCredito(null,'${p.sku}',${pl.semanas},'${freq}')">Elegir</button>`}</td></tr>`).join('')}
      </tbody></table></div></div>
      <span class="sub" style="margin-top:8px">Enganche sugerido del ${Math.round(p.engPct * 100)}%; se puede ajustar al registrar la venta.</span>
      ${!p.planes.length ? '<div class="alert" style="background:var(--soft);color:var(--muted)">Este artículo no tiene plan de financiamiento; solo se vende de contado.</div>' : ''}
      ${agotado
        ? `<div class="alert">Artículo agotado. <a href="#" onclick="event.preventDefault();modalStock('${p.sku}')" style="color:inherit;font-weight:700">Registrar entrada de mercancía</a></div>`
        : `<div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="btn" style="flex:1;justify-content:center" onclick="modalContado('${p.sku}')">Venta de contado</button>${p.planes.length ? `<button type="button" class="btn pri" style="flex:1;justify-content:center" onclick="modalCredito(null,'${p.sku}',null,'${freq}')">Venta a crédito</button>` : ''}</div>`}
    </div></div>`, null, null, true);
}

function modalContado(sku) {
  const p = productos.find(x => x.sku === sku);
  openModal(`Venta de contado · ${esc(p.nombre)}`, `<div class="fgrid">
    ${field('Cliente', `<select class="input" name="cliente"><option value="">Público en general</option>${optClientes(null)}</select>`, true)}
    ${field('Cantidad', `<input class="input" type="number" name="cant" value="1" min="1" max="${p.stock}" required>`)}
    ${field('Forma de pago', '<select class="input" name="forma"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select>')}
  </div><div class="preview" id="pv"></div>`, d => {
    const cant = +d.cant;
    if (cant > p.stock) { toast(`Solo hay ${p.stock} pzas en existencia`); return false; }
    p.stock -= cant;
    ventasContado.push({ fecha: HOY, sku, cant, total: cant * p.precio, clienteId: d.cliente ? +d.cliente : null, forma: d.forma });
    toast(`Venta registrada · quedan ${p.stock} pzas`);
  }, d => {
    const cant = +d.cant || 0;
    document.getElementById('pv').innerHTML = `<div class="kv"><span>Precio unitario</span><b>${$m(p.precio)}</b></div><div class="kv"><span>Total a cobrar</span><b style="color:var(--brand);font-size:16px">${$m(cant * p.precio)}</b></div><div class="kv"><span>Existencia después de la venta</span><b>${p.stock - cant}</b></div>${cant > p.stock ? `<div class="alert">Solo hay ${p.stock} pzas en existencia.</div>` : ''}`;
  });
}

function modalStock(sku) {
  const p = productos.find(x => x.sku === sku);
  openModal(`Ajustar existencia · ${esc(p.nombre)}`, `<div class="fgrid">
    ${field('Movimiento', '<select class="input" name="tipo"><option value="in">Entrada (compra a proveedor)</option><option value="out">Salida (merma / devolución)</option></select>')}
    ${field('Cantidad', '<input class="input" type="number" name="cant" value="1" min="1" required>')}
  </div><div class="preview" id="pv"></div>`, d => {
    const n = +d.cant * (d.tipo === 'in' ? 1 : -1);
    if (p.stock + n < 0) { toast('No hay suficiente existencia'); return false; }
    p.stock += n; toast(`Existencia actualizada: ${p.stock} pzas`);
  }, d => { document.getElementById('pv').innerHTML = `<div class="kv"><span>Existencia actual</span><b>${p.stock}</b></div><div class="kv"><span>Quedará en</span><b>${p.stock + (+d.cant || 0) * (d.tipo === 'in' ? 1 : -1)}</b></div>`; });
}

// Al cambiar producto o plazo, aplica el enganche y recargo del plan
function ajustarPlan(f, cambio) {
  const p = productos.find(x => x.sku === f.sku.value);
  if (cambio === 'sku') { f.enganche.value = engancheSugerido(p); f.semanas.innerHTML = opcionesPlazo(p, planMedio(p).semanas); }
  f.recargo.value = Math.round(planDe(p, f.semanas.value).recargo * 100);
  document.getElementById('pfoto').innerHTML = fotoHTML(p);
  f.oninput();
}
const selectorFreq = (sel, opciones = ['semanal', 'quincenal']) => `<div class="seg">${opciones.map(f => `<label><input type="radio" name="freq" value="${f}" ${f === sel ? 'checked' : ''}><span>${f[0].toUpperCase() + f.slice(1)}</span></label>`).join('')}</div>`;
const opcionesPlazo = (p, sel) => p.planes.map(pl => `<option value="${pl.semanas}" ${pl.semanas === +sel ? 'selected' : ''}>${pl.semanas} semanas (+${Math.round(pl.recargo * 100)}%)</option>`).join('');
function modalCredito(clienteId, sku, semanas, freq = 'semanal') {
  const disp = productos.filter(p => p.stock > 0 && p.planes.length);
  if (!disp.length) { toast('No hay artículos con existencia y plan de financiamiento'); return; }
  const p0 = disp.find(p => p.sku === sku) || disp[0];
  const plan0 = semanas ? planDe(p0, semanas) : planMedio(p0);
  openModal('Nueva venta a crédito', `<div class="fgrid">
    ${field('Cliente', `<select class="input" name="cliente">${optClientes(clienteId || clientes[0].id)}</select>`, true)}
    <div class="field full"><label>Artículo del catálogo</label><div style="display:flex;gap:10px;align-items:center"><div class="thumb" id="pfoto">${fotoHTML(p0)}</div><select class="input" style="flex:1" name="sku" onchange="ajustarPlan(this.form,'sku')">${disp.map(p => `<option value="${p.sku}" ${p === p0 ? 'selected' : ''}>${esc(p.nombre)} — ${$m(p.precio)} (${p.stock} disp.)</option>`).join('')}</select></div></div>
    ${field('Enganche' + ayuda('Pago inicial que da el cliente al llevarse el artículo. Se resta del precio antes de calcular los abonos.'), `<input class="input" type="number" name="enganche" value="${engancheSugerido(p0)}" min="0" step="0.01">`)}
    ${field('Plan de financiamiento' + ayuda('Plazo en semanas configurado en el artículo. Cada plazo tiene su propio recargo.'), `<select class="input" name="semanas" onchange="ajustarPlan(this.form,'plazo')">${opcionesPlazo(p0, plan0.semanas)}</select>`)}
    ${field('Frecuencia de pago', selectorFreq(freq), true)}
    ${field('Recargo por financiamiento (%)' + ayuda('Porcentaje extra que se cobra por pagar a plazos. Se aplica sobre lo que queda después del enganche.'), `<input class="input" type="number" name="recargo" value="${Math.round(plan0.recargo * 100)}" min="0" step="any">`)}
  </div><div class="preview" id="pv"></div>`, d => {
    const c = armarCredito(d);
    if (c.enganche >= c.precio) { toast('El enganche cubre el total: registrar como venta de contado'); return false; }
    const prod = productos.find(p => p.sku === c.sku);
    if (prod.stock < 1) { toast('Artículo sin existencia'); return false; }
    creditos.push(c); prod.stock -= 1;
    toast(`Crédito ${c.id} registrado · pago ${c.freq}`); state.view = 'cliente'; state.clienteId = c.clienteId;
  }, d => {
    const c = armarCredito(d), k = credCalc(c), r = resumenCliente(c.clienteId), cl = cliente(c.clienteId);
    const excede = r.saldoCred + k.financiado > cl.limite;

function armarCredito(d) {
  const p = productos.find(x => x.sku === d.sku);
  return { id: nextFolio(creditos, 'CR'), clienteId: +d.cliente, sku: p.sku, producto: p.nombre, cant: 1, precio: p.precio, enganche: +d.enganche || 0, recargo: (+d.recargo || 0) / 100, semanas: +d.semanas, freq: d.freq || 'semanal', fecha: HOY, abonos: [] };
}

// Calendario de pagos de un préstamo (interés simple, pagos fijos; el último ajusta los centavos)
const r2 = n => Math.round(n * 100) / 100;
function calendarioPrestamo(p) {
  const k = presCalc(p), n = k.nPagos, dias = FREQ[p.freq].dias;
  const cap = r2(p.monto / n);
  let acum = 0, pagadoRest = k.pagado;
  return Array.from({ length: n }, (_, i) => {
    const ultimo = i === n - 1;
    const pago = ultimo ? r2(k.totalPagar - k.pago * (n - 1)) : k.pago;
    const capital = ultimo ? r2(p.monto - cap * (n - 1)) : cap;
    acum += pago;
    const cubierto = Math.min(pago, Math.max(0, pagadoRest)); pagadoRest -= pago;
    const fecha = addDays(p.fecha, dias * (i + 1));
    const estado = cubierto >= pago - 0.5 ? 'Pagado' : cubierto > 0 ? 'Parcial' : fecha < HOY ? 'Vencido' : 'Pendiente';
    return { n: i + 1, fecha, capital, interes: r2(pago - capital), pago, saldo: r2(Math.max(0, k.totalPagar - acum)), estado };
  });
}
function tablaPagos(p, conEstado) {

  const prox = conEstado ? filas.find(f => f.estado !== 'Pagado') : null;
  const est = f => ({ Pagado: 'b-ok', Parcial: 'b-warn', Vencido: 'b-bad', Pendiente: 'b-mut' })[f.estado];
  return `<div class="amort-sum">
      <div><span>Monto prestado</span><b>${$m(p.monto)}</b></div>
      <div><span>Intereses</span><b>${$m(k.intereses)}</b></div>
      <div><span>Total a pagar</span><b>${$m(k.totalPagar)}</b></div>
      <div class="hl"><span>${k.nPagos} pagos ${freqPl(p.freq)}</span><b>${$m(k.pago)}</b></div>
    </div>
    <div class="amort-wrap"><table class="amort"><thead><tr><th>#</th><th>Fecha</th><th class="num">Capital</th><th class="num">Interés</th><th class="num">Pago</th><th class="num">Saldo</th>${conEstado ? '<th>Estado</th>' : ''}</tr></thead><tbody>
    ${filas.map(f => `<tr class="${f === prox ? 'prox' : ''}"><td>${f.n}</td><td>${fdate(f.fecha)}</td><td class="num">${$m(f.capital)}</td><td class="num">${$m(f.interes)}</td><td class="num"><b>${$m(f.pago)}</b></td><td class="num muted">${$m(f.saldo)}</td>${conEstado ? `<td><span class="badge ${est(f)}">${f === prox && f.estado === 'Pendiente' ? 'Próximo' : f.estado}</span></td>` : ''}</tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2">Total · ${k.nPagos} pagos</td><td class="num">${$m(sum(filas, f => f.capital))}</td><td class="num">${$m(sum(filas, f => f.interes))}</td><td class="num">${$m(sum(filas, f => f.pago))}</td><td></td>${conEstado ? '<td></td>' : ''}</tr></tfoot></table></div>
    ${conEstado ? `<div class="amort-sum" style="margin-top:12px"><div><span>Pagado</span><b style="color:var(--ok)">${$m(k.pagado)}</b></div><div><span>Saldo pendiente</span><b>${$m(k.saldo)}</b></div><div><span>Pagos cubiertos</span><b>${k.hechos} de ${k.nPagos}</b></div><div><span>Atraso</span><b style="color:${k.atraso ? 'var(--bad)' : 'inherit'}">${k.atraso} días</b></div></div>` : ''}`;
}

const notas = [];

// Cuentas abiertas de un cliente (créditos y préstamos) con lo que debe pagar
function cuentasCliente(id) {
  const cr = creditos.filter(c => c.clienteId === id).map(x => {
    const k = credCalc(x), transcurridos = Math.min(k.nPagos, Math.floor(diffDays(HOY, x.fecha) / k.dias));
    return { x, k, tipo: 'Crédito', desc: x.producto, cuota: k.abono, periodo: k.freq, vencidos: Math.max(0, transcurridos - k.hechos) };
  });
  const pr = prestamos.filter(p => p.clienteId === id).map(x => {
    const k = presCalc(x), transcurridos = Math.min(k.nPagos, Math.floor(diffDays(HOY, x.fecha) / FREQ[x.freq].dias));
    return { x, k, tipo: 'Préstamo', desc: `Préstamo ${$m(x.monto)}`, cuota: k.pago, periodo: x.freq, vencidos: Math.max(0, transcurridos - k.hechos) };
  });
  return [...cr, ...pr].filter(c => !c.k.liquidado).map(c => {
    const cuotaReal = Math.min(c.cuota, c.k.saldo);
    const vencido = Math.min(c.k.saldo, c.vencidos * c.cuota);
    return { ...c, cuotaReal, vencido, sugerido: Math.round((vencido || cuotaReal) * 100) / 100 };
  });
}

function registrarCobro(clienteId, partidas, forma, recibido) {
  const folio = 'N-' + String(notas.length + 1).padStart(4, '0');
  const lineas = partidas.map(({ cuenta, monto }) => {
    const calc = cuenta.x.id.startsWith('CR') ? credCalc : presCalc;
    const antes = calc(cuenta.x).saldo;
    const abono = Math.min(monto, antes);
    cuenta.x.abonos.push({ fecha: HOY, monto: abono, nota: folio, forma });
    const despues = calc(cuenta.x);
    return { ref: cuenta.x.id, desc: cuenta.desc, tipo: cuenta.tipo, antes, abono, despues: despues.saldo, prox: despues.liquidado ? null : despues.prox };
  }).filter(l => l.abono > 0);
  const total = sum(lineas, l => l.abono);
  const nota = { folio, fecha: HOY, hora: horaActual(), cobrador: usuario?.nombre, clienteId, lineas, total, forma, recibido: forma === 'Efectivo' ? Math.max(recibido, total) : total, saldoCliente: resumenCliente(clienteId).saldo };
  nota.cambio = nota.recibido - total;
  notas.unshift(nota);
  return nota;
}

/* ============ Cartera global: cada pago programado de todas las cuentas ============ */
// Reparte los abonos de una cuenta sobre su calendario para saber qué pagos están cubiertos y cuándo se pagaron
function cuotasCuenta(x) {
  const esCred = x.id.startsWith('CR');
  const k = esCred ? credCalc(x) : presCalc(x);
  const n = k.nPagos, freq = esCred ? k.freq : x.freq, dias = FREQ[freq].dias;
  const pago = esCred ? k.abono : k.pago, total = esCred ? k.financiado : k.totalPagar;
  const abonos = [...x.abonos].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const out = [];
  let ai = 0, acumAb = 0, acum = 0;
  for (let i = 0; i < n; i++) {
    const monto = r2(i === n - 1 ? total - acum : Math.min(pago, total - acum));
    if (monto <= 0.005) break;
    acum += monto;
    while (ai < abonos.length && acumAb + 0.5 < acum) acumAb += abonos[ai++].monto;
    const cubierto = r2(Math.max(0, Math.min(monto, acumAb - (acum - monto))));
    const pendiente = r2(monto - cubierto);
    const fecha = addDays(x.fecha, dias * (i + 1));
    const estado = pendiente < 0.5 ? 'Pagado' : fecha < HOY ? 'Vencido' : diffDays(fecha, HOY) <= 7 ? 'Por vencer' : 'Pendiente';
    out.push({
      ref: x.id, tipo: esCred ? 'Crédito' : 'Préstamo', clienteId: x.clienteId, desc: esCred ? x.producto : `Préstamo ${$m(x.monto)}`,
      freq, n: i + 1, de: n, fecha, monto, cubierto, pendiente: pendiente < 0.5 ? 0 : pendiente, estado,
      fechaPago: estado === 'Pagado' ? abonos[ai - 1]?.fecha : null, atraso: estado === 'Vencido' ? diffDays(HOY, fecha) : 0,
    });
  }
  return out;
}
const todasCuotas = () => [...creditos, ...prestamos].flatMap(cuotasCuenta);
function pagosRecibidos() {
  const out = [];
  creditos.forEach(c => {
    if (c.enganche > 0) out.push({ fecha: c.fecha, clienteId: c.clienteId, ref: c.id, tipo: 'Crédito', freq: credCalc(c).freq, concepto: 'Enganche', monto: c.enganche, nota: '', forma: '' });
    c.abonos.forEach(a => out.push({ fecha: a.fecha, clienteId: c.clienteId, ref: c.id, tipo: 'Crédito', freq: credCalc(c).freq, concepto: 'Abono', monto: a.monto, nota: a.nota || '', forma: a.forma || '' }));
  });
  prestamos.forEach(p => p.abonos.forEach(a => out.push({ fecha: a.fecha, clienteId: p.clienteId, ref: p.id, tipo: 'Préstamo', freq: p.freq, concepto: 'Pago', monto: a.monto, nota: a.nota || '', forma: a.forma || '' })));
  return out.sort((a, b) => b.fecha.localeCompare(a.fecha));
}

    ${estado ? sel('estado', [['Todos', 'Todos'], ...ESTADOS_CUOTA.map(e => [e, e])], 'Estado del pago') : ''}
    ${rango ? filtroRango() : ''}
    ${activos ? `<button class="btn sm ghost" style="align-self:flex-end" onclick="limpiarFiltros()">Limpiar filtros (${activos})</button>` : ''}
  </div>`;
}
function limpiarFiltros() { state.f = { tipo: 'Todos', freq: 'Todas', estado: 'Todos' }; state.q = ''; render(); }
const inicioMes = s => s.slice(0, 8) + '01';
function rangoRapido(k) {
  const im = inicioMes(HOY), d = D(im); d.setMonth(d.getMonth() - 1);
  const r = { hoy: [HOY, HOY], semana: [addDays(HOY, -6), HOY], mes: [im, HOY], anterior: [iso(d), addDays(im, -1)], anio: [HOY.slice(0, 4) + '-01-01', HOY], todo: ['2000-01-01', '2100-12-31'] }[k];
  state.rango = { desde: r[0], hasta: r[1], quick: k }; render();
}
function filtroRango() {
  const R = state.rango;
  return `<div class="flt"><span>Periodo de pagos</span><div class="tabs">${[['hoy', 'Hoy'], ['semana', '7 días'], ['mes', 'Este mes'], ['anterior', 'Mes anterior'], ['anio', 'Año'], ['todo', 'Todo']].map(([k, l]) => `<button class="tab ${R.quick === k ? 'on' : ''}" onclick="rangoRapido('${k}')">${l}</button>`).join('')}</div></div>
    <label class="flt"><span>Desde</span><input class="input" type="date" value="${R.quick === 'todo' ? '' : R.desde}" onchange="state.rango={...state.rango,desde:this.value||'2000-01-01',quick:''};render()"></label>
    <label class="flt"><span>Hasta</span><input class="input" type="date" value="${R.quick === 'todo' ? '' : R.hasta}" onchange="state.rango={...state.rango,hasta:this.value||'2100-12-31',quick:''};render()"></label>`;
}
const enRango = f => f >= state.rango.desde && f <= state.rango.hasta;
const nombreRango = () => state.rango.quick === 'todo' ? 'todo el historial' : `${fdate(state.rango.desde)} – ${fdate(state.rango.hasta)}`;

/* ---- Estados de cuenta: Global / Calendario / Por cliente ---- */
const estadoClienteView = VIEWS.estados;
VIEWS.estados = function () {
  const tabs = [['global', 'Global de cartera'], ['calendario', 'Calendario'], ['cliente', 'Por cliente']];
  return header('Estados de cuenta', 'Cartera vencida, próximos pagos y pagos recibidos', state.ecTab === 'cliente' ? `<button class="btn" onclick="window.print()">Imprimir / PDF</button>` : `<button class="btn" onclick="go('reportes')">Ver reportes →</button>`) +
    `<div class="tabs big-tabs no-print">${tabs.map(([k, l]) => `<button class="tab ${state.ecTab === k ? 'on' : ''}" onclick="state.ecTab='${k}';render()">${l}</button>`).join('')}</div>` +
    (state.ecTab === 'global' ? vistaGlobal() : state.ecTab === 'calendario' ? vistaCalendario() : estadoClienteView());
};

function vistaGlobal() {
  const todas = filtrarFilas(todasCuotas(), { estado: false });
  const pagos = filtrarFilas(pagosRecibidos(), { estado: false }).filter(p => enRango(p.fecha));
  const suma = e => sum(todas.filter(c => c.estado === e), c => e === 'Pagado' ? c.cubierto : c.pendiente);
  const tot = { Pagado: sum(todas, c => c.cubierto), Vencido: suma('Vencido'), 'Por vencer': suma('Por vencer'), Pendiente: suma('Pendiente') };
  const totalGen = sum(Object.values(tot)) || 1;
  const vencidas = todas.filter(c => c.estado === 'Vencido');
  const buckets = [['1 – 7 días', 1, 7], ['8 – 15 días', 8, 15], ['16 – 30 días', 16, 30], ['31 – 60 días', 31, 60], ['Más de 60 días', 61, 1e9]].map(([l, a, b]) => {
    const rows = vencidas.filter(c => c.atraso >= a && c.atraso <= b);
    return { l, monto: sum(rows, c => c.pendiente), n: new Set(rows.map(c => c.clienteId)).size };
  });
  const maxB = Math.max(...buckets.map(b => b.monto), 1);
  // Resumen por cliente
  let filas = clientes.map(c => {
    const cs = todas.filter(x => x.clienteId === c.id);
    if (!cs.length) return null;
    const venc = cs.filter(x => x.estado === 'Vencido'), prox = cs.filter(x => x.estado !== 'Pagado' && x.estado !== 'Vencido').sort((a, b) => a.fecha.localeCompare(b.fecha))[0];
    const saldo = sum(cs, x => x.pendiente), vencido = sum(venc, x => x.pendiente);
    const estado = saldo < 0.5 ? 'Liquidado' : vencido ? 'Vencido' : prox && prox.estado === 'Por vencer' ? 'Por vencer' : 'Al corriente';
    return { c, saldo, vencido, atraso: Math.max(0, ...venc.map(x => x.atraso)), cuotasV: venc.length, prox, pagado: sum(pagos.filter(p => p.clienteId === c.id), p => p.monto), estado };
  }).filter(Boolean);
  const fe = state.f.estado;
  if (fe !== 'Todos') filas = filas.filter(r => fe === 'Pagado' ? r.pagado > 0 : fe === 'Pendiente' ? r.estado === 'Al corriente' : r.estado === fe);
  filas.sort((a, b) => b.vencido - a.vencido || b.saldo - a.saldo);
  const bEst = { Vencido: 'b-bad', 'Por vencer': 'b-warn', 'Al corriente': 'b-ok', Liquidado: 'b-mut' };
  return barraFiltros({ rango: true }) + `
    <div class="grid kpis" style="margin:16px 0">
      <div class="card kpi"><span>Cartera por cobrar</span><b>${$m(tot.Vencido + tot['Por vencer'] + tot.Pendiente)}</b><small>${new Set(todas.filter(c => c.pendiente).map(c => c.ref)).size} cuentas abiertas</small></div>
      <div class="card kpi kpi-bad"><span>Cartera vencida ${ayuda('Pagos cuya fecha ya pasó y no se han cubierto completos.')}</span><b>${$m(tot.Vencido)}</b><small>${vencidas.length} pagos · ${new Set(vencidas.map(c => c.clienteId)).size} clientes</small></div>
      <div class="card kpi kpi-warn"><span>Próximos 7 días ${ayuda('Pagos que vencen hoy o en los siguientes 7 días.')}</span><b>${$m(tot['Por vencer'])}</b><small>${todas.filter(c => c.estado === 'Por vencer').length} pagos por vencer</small></div>
      <div class="card kpi kpi-ok"><span>Cobrado · ${state.rango.quick === 'mes' ? 'este mes' : 'periodo'}</span><b>${$m(sum(pagos, p => p.monto))}</b><small>${pagos.length} pagos de ${new Set(pagos.map(p => p.clienteId)).size} clientes</small></div>
    </div>
    <div class="grid two">
      <div class="card"><div class="card-h"><h3>Composición de la cartera</h3><span class="muted">${$m(totalGen)} programado</span></div><div class="card-b">
        <div class="stackbar">${ESTADOS_CUOTA.slice().reverse().map(e => tot[e] ? `<i style="width:${tot[e] / totalGen * 100}%;background:${COLOR_ESTADO[e]}" title="${e}: ${$m(tot[e])}"></i>` : '').join('')}</div>
        <div class="leg-grid">${['Pagado', 'Vencido', 'Por vencer', 'Pendiente'].map(e => `<button class="leg ${fe === e ? 'on' : ''}" onclick="setF('estado','${fe === e ? 'Todos' : e}')"><i style="background:${COLOR_ESTADO[e]}"></i><span>${e === 'Pendiente' ? 'Pendiente (futuro)' : e}</span><b>${$m(tot[e])}</b><small>${Math.round(tot[e] / totalGen * 100)}%</small></button>`).join('')}</div>
        <span class="sub" style="margin-top:8px">Haz clic en un estado para filtrar la tabla de clientes.</span>
      </div></div>
      <div class="card"><div class="card-h"><h3>Antigüedad de la cartera vencida</h3></div><div class="card-b">
        ${buckets.map(b => `<div class="aging"><span>${b.l}</span><div class="bar bad"><i style="width:${b.monto / maxB * 100}%"></i></div><b>${$m(b.monto)}</b><small>${b.n} cte${b.n === 1 ? '' : 's'}</small></div>`).join('')}
      </div></div>
    </div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>Cartera por cliente</h3><span class="muted">${filas.length} clientes</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th class="num">Saldo</th><th class="num">Vencido</th><th class="num">Atraso</th><th>Próximo pago</th><th class="num">Pagado en periodo</th><th>Estado</th></tr></thead><tbody>
      ${filas.map(r => `<tr class="click" onclick="go('estados',{ecCliente:${r.c.id}})"><td><b>${esc(r.c.nombre)}</b><span class="sub">${esc(r.c.tel)}</span></td><td class="num"><b>${$m(r.saldo)}</b></td><td class="num ${r.vencido ? 'pos' : 'muted'}">${r.vencido ? $m(r.vencido) + `<span class="sub">${r.cuotasV} pago${r.cuotasV === 1 ? '' : 's'}</span>` : '—'}</td><td class="num">${r.atraso ? `<b style="color:var(--bad)">${r.atraso} días</b>` : '—'}</td><td>${r.prox ? `${fdate(r.prox.fecha)}<span class="sub">${$m(r.prox.pendiente)} · ${r.prox.ref}</span>` : '—'}</td><td class="num ${r.pagado ? 'neg' : 'muted'}">${r.pagado ? $m(r.pagado) : '$0.00'}</td><td><span class="badge ${bEst[r.estado]}">${r.estado}</span></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin clientes con esos filtros</td></tr>'}
      </tbody><tfoot><tr><td>Total</td><td class="num">${$m(sum(filas, r => r.saldo))}</td><td class="num">${$m(sum(filas, r => r.vencido))}</td><td></td><td></td><td class="num">${$m(sum(filas, r => r.pagado))}</td><td></td></tr></tfoot></table></div></div>`;
}

const MESES_CORTOS = d => D(d).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
function moverMes(n) { const d = D(state.calMes + '-01'); d.setMonth(d.getMonth() + n); state.calMes = iso(d).slice(0, 7); state.calDia = null; render(); }
function vistaCalendario() {
  const mes = state.calMes, ini = mes + '-01';
  const cuotas = filtrarFilas(todasCuotas()).filter(c => c.fecha.startsWith(mes));
  const porDia = {};
  cuotas.forEach(c => (porDia[c.fecha] ||= []).push(c));
  const d0 = D(ini), offset = (d0.getDay() + 6) % 7, diasMes = new Date(d0.getFullYear(), d0.getMonth() + 1, 0).getDate();
  const celdas = [...Array(offset).fill(null), ...Array.from({ length: diasMes }, (_, i) => addDays(ini, i))];
  while (celdas.length % 7) celdas.push(null);
  const tot = e => sum(cuotas.filter(c => c.estado === e), c => e === 'Pagado' ? c.cubierto : c.pendiente);
  const dia = state.calDia && state.calDia.startsWith(mes) ? state.calDia : null;
  const lista = (dia ? porDia[dia] || [] : cuotas).slice().sort((a, b) => a.fecha.localeCompare(b.fecha) || ESTADOS_CUOTA.indexOf(a.estado) - ESTADOS_CUOTA.indexOf(b.estado));
  const fila = c => `<tr><td>${fdate(c.fecha)}</td><td><b>${esc(cliente(c.clienteId).nombre)}</b><span class="sub">${esc(cliente(c.clienteId).tel)}</span></td><td><b>${c.ref}</b> <span class="muted">· pago ${c.n}/${c.de}</span><span class="sub">${esc(c.desc)} · ${c.freq}</span></td><td class="num"><b>${$m(c.monto)}</b>${c.estado !== 'Pagado' && c.cubierto ? `<span class="sub">faltan ${$m(c.pendiente)}</span>` : ''}</td><td><span class="badge ${BADGE_ESTADO[c.estado]}">${c.estado}${c.atraso ? ` · ${c.atraso} d` : ''}</span>${c.fechaPago ? `<span class="sub">pagado ${fdate(c.fechaPago)}</span>` : ''}</td><td class="num">${c.estado === 'Pagado' ? '' : `<button class="btn sm" onclick="modalAbono('${c.ref}')">Cobrar</button>`}</td></tr>`;
  return barraFiltros() + `
    <div class="card" style="margin-top:16px">
      <div class="card-h cal-h"><div style="display:flex;align-items:center;gap:6px"><button class="btn sm" onclick="moverMes(-1)">‹</button><h3 class="cal-mes">${MESES_CORTOS(ini)}</h3><button class="btn sm" onclick="moverMes(1)">›</button><button class="btn sm ghost" onclick="state.calMes=HOY.slice(0,7);state.calDia=HOY;render()">Hoy</button></div>
        <div class="cal-tot">${ESTADOS_CUOTA.map(e => `<span><i style="background:${COLOR_ESTADO[e]}"></i>${e} <b>${$m(tot(e))}</b></span>`).join('')}</div></div>
      <div class="cal">
        ${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${celdas.map(f => {
          if (!f) return '<div class="cal-d vacio"></div>';
          const cs = porDia[f] || [];
          const grupos = ESTADOS_CUOTA.map(e => [e, cs.filter(c => c.estado === e)]).filter(([, a]) => a.length);
          return `<button class="cal-d ${f === HOY ? 'hoy' : ''} ${f === dia ? 'sel' : ''} ${cs.length ? '' : 'sin'}" onclick="state.calDia=${f === dia ? 'null' : `'${f}'`};render()">
            <span class="cal-n">${+f.slice(8)}</span>
            ${grupos.map(([e, a]) => `<span class="cal-e" style="--c:${COLOR_ESTADO[e]}"><i></i><em>${a.length}</em><b>${$m(sum(a, c => e === 'Pagado' ? c.cubierto : c.pendiente)).replace('.00', '')}</b></span>`).join('')}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>${dia ? `Pagos del ${fdate(dia)}` : `Todos los pagos de ${MESES_CORTOS(ini)}`}</h3><span class="muted">${lista.length} pagos · ${$m(sum(lista, c => c.monto))}${dia ? ` · <a href="#" onclick="event.preventDefault();state.calDia=null;render()">ver todo el mes</a>` : ''}</span></div>
      ${lista.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Cuenta</th><th class="num">Monto</th><th>Estado</th><th></th></tr></thead><tbody>${lista.map(fila).join('')}</tbody></table></div>` : '<div class="empty">No hay pagos programados con esos filtros</div>'}
    </div>`;
}

/* ---- Reportes ---- */
let repActual = { nombre: 'reporte', filas: [] };
function descargarCSV() {
  const csv = repActual.filas.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = repActual.nombre + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
VIEWS.reportes = function () {
  const tabs = [['pagados', 'Quién me ha pagado'], ['nopagados', 'Quién no ha pagado'], ['proximos', 'Próximos a pagar']];
  const cuerpo = state.repTab === 'pagados' ? repPagados() : state.repTab === 'nopagados' ? repNoPagados() : repProximos();
  return header('Reportes', `${EMPRESA.nombre} · generado el ${fdate(HOY)}`, `<button class="btn" onclick="descargarCSV()">Exportar a Excel (CSV)</button><button class="btn" onclick="window.print()">Imprimir</button>`) +
    `<div class="tabs big-tabs no-print">${tabs.map(([k, l]) => `<button class="tab ${state.repTab === k ? 'on' : ''}" onclick="state.repTab='${k}';render()">${l}</button>`).join('')}</div>
    <h2 class="print-only rep-title">${tabs.find(t => t[0] === state.repTab)[1]}</h2>` + cuerpo;
};
function repPagados() {
  const pagos = filtrarFilas(pagosRecibidos(), { estado: false }).filter(p => enRango(p.fecha));
  const porCliente = Object.values(pagos.reduce((m, p) => {
    const r = m[p.clienteId] ||= { c: cliente(p.clienteId), n: 0, total: 0, ultimo: '', cuentas: new Set() };
    r.n++; r.total += p.monto; r.cuentas.add(p.ref); if (p.fecha > r.ultimo) r.ultimo = p.fecha; return m;
  }, {})).sort((a, b) => b.total - a.total);
  const sinPago = clientes.filter(c => !porCliente.some(r => r.c.id === c.id) && cuotasCliente(c.id).some(x => x.pendiente));
  repActual = { nombre: `pagos-recibidos-${state.rango.desde}-a-${state.rango.hasta}`, filas: [['Fecha', 'Cliente', 'Cuenta', 'Tipo', 'Concepto', 'Nota', 'Forma de pago', 'Monto'], ...pagos.map(p => [p.fecha, cliente(p.clienteId).nombre, p.ref, p.tipo, p.concepto, p.nota, p.forma, p.monto.toFixed(2)])] };
  const total = sum(pagos, p => p.monto);
  return barraFiltros({ estado: false, rango: true }) + `
    <div class="grid kpis" style="margin:16px 0">
      <div class="card kpi kpi-ok"><span>Total cobrado</span><b>${$m(total)}</b><small>${nombreRango()}</small></div>
      <div class="card kpi"><span>Pagos recibidos</span><b>${pagos.length}</b><small>incluye enganches</small></div>
      <div class="card kpi"><span>Clientes que pagaron</span><b>${porCliente.length}</b><small>de ${clientes.length} clientes</small></div>
      <div class="card kpi kpi-warn"><span>Con saldo y sin pagar en el periodo</span><b>${sinPago.length}</b><small>${sinPago.slice(0, 2).map(c => esc(c.nombre.split(' ')[0])).join(', ')}${sinPago.length > 2 ? '…' : ''}</small></div>
    </div>
    <div class="grid two">
      <div class="card"><div class="card-h"><h3>Detalle de pagos</h3><span class="muted">${pagos.length}</span></div>
        ${pagos.length ? `<div class="tbl-wrap scroll-y"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Cuenta</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>
        ${pagos.map(p => `<tr><td>${fdate(p.fecha)}</td><td>${esc(cliente(p.clienteId).nombre)}</td><td><b>${p.ref}</b><span class="sub">${p.tipo} · ${p.freq}</span></td><td>${p.concepto}${p.nota ? `<span class="sub">Nota ${p.nota} · ${p.forma}</span>` : ''}</td><td class="num neg"><b>${$m(p.monto)}</b></td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${$m(total)}</td></tr></tfoot></table></div>` : '<div class="empty">No hay pagos en el periodo</div>'}</div>
      <div class="grid" style="align-content:start">
        <div class="card"><div class="card-h"><h3>Por cliente</h3></div>
          ${porCliente.map(r => `<div class="row click" onclick="go('estados',{ecCliente:${r.c.id}})"><div class="avatar">${initials(r.c.nombre)}</div><div class="grow"><b>${esc(r.c.nombre)}</b><span class="sub">${r.n} pago${r.n === 1 ? '' : 's'} · último ${fdate(r.ultimo)}</span></div><b class="neg num">${$m(r.total)}</b></div>`).join('') || '<div class="empty">—</div>'}</div>
        ${sinPago.length ? `<div class="card"><div class="card-h"><h3>Con saldo que no pagaron en el periodo</h3></div>${sinPago.map(c => `<div class="row click" onclick="go('cobranza',{cobCliente:${c.id}})"><div class="avatar" style="background:var(--warn-soft);color:var(--warn)">${initials(c.nombre)}</div><div class="grow"><b>${esc(c.nombre)}</b><span class="sub">${esc(c.tel)} · saldo ${$m(resumenCliente(c.id).saldo)}</span></div><span class="btn sm">Cobrar</span></div>`).join('')}</div>` : ''}
      </div>
    </div>`;
}
function repNoPagados() {
  const venc = filtrarFilas(todasCuotas(), { estado: false }).filter(c => c.estado === 'Vencido' && c.atraso >= state.atrasoMin);
  const pagos = pagosRecibidos();
  const filas = Object.values(venc.reduce((m, c) => {
    const r = m[c.clienteId] ||= { c: cliente(c.clienteId), cuotas: 0, monto: 0, atraso: 0, cuentas: new Set() };
    r.cuotas++; r.monto += c.pendiente; r.atraso = Math.max(r.atraso, c.atraso); r.cuentas.add(c.ref); return m;
  }, {})).map(r => ({ ...r, ultimo: pagos.find(p => p.clienteId === r.c.id && p.concepto !== 'Enganche')?.fecha })).sort((a, b) => b.atraso - a.atraso || b.monto - a.monto);
  repActual = { nombre: `cartera-vencida-${HOY}`, filas: [['Cliente', 'Teléfono', 'Cuentas', 'Pagos vencidos', 'Monto vencido', 'Días de atraso', 'Último pago'], ...filas.map(r => [r.c.nombre, r.c.tel, [...r.cuentas].join(' '), r.cuotas, r.monto.toFixed(2), r.atraso, r.ultimo || ''])] };
  return barraFiltros({ estado: false }) + `
    <div class="toolbar" style="border:0;padding:12px 0 0"><div class="flt"><span>Atraso mínimo</span><div class="tabs">${[[0, 'Todos'], [8, 'Más de 7 días'], [16, 'Más de 15 días'], [31, 'Más de 30 días']].map(([v, l]) => `<button class="tab ${state.atrasoMin === v ? 'on' : ''}" onclick="state.atrasoMin=${v};render()">${l}</button>`).join('')}</div></div></div>
    <div class="grid kpis" style="margin:16px 0">
      <div class="card kpi kpi-bad"><span>Monto vencido</span><b>${$m(sum(filas, r => r.monto))}</b><small>al ${fdate(HOY)}</small></div>
      <div class="card kpi"><span>Clientes con atraso</span><b>${filas.length}</b></div>
      <div class="card kpi"><span>Pagos vencidos</span><b>${venc.length}</b></div>
      <div class="card kpi"><span>Atraso promedio</span><b>${filas.length ? Math.round(sum(filas, r => r.atraso) / filas.length) : 0} días</b></div>

function mezclar(hex, con, t) {
  const a = hex.match(/\w\w/g).map(x => parseInt(x, 16)), b = con.match(/\w\w/g).map(x => parseInt(x, 16));
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');

// Buscador global (Ctrl K o "/")
let palItems = [], palSel = 0;
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function abrirBuscador() {
  cerrarNuevo(); cerrarMas();
  document.getElementById('pal').classList.add('show');
  const i = document.getElementById('palIn'); i.value = ''; buscar(''); setTimeout(() => i.focus(), 20);
}
function cerrarBuscador() { document.getElementById('pal').classList.remove('show'); }
function buscar(q) {
  const n = norm(q.trim()), has = s => norm(s).includes(n), out = [];
  const add = (grupo, items) => items.slice(0, 6).forEach(x => out.push({ grupo, ...x }));
  add('Acciones', ACCIONES.filter(a => !n || has(a[1] + ' ' + a[2])).map(([ic, t, s, run]) => ({ ic, t, s, run })));
  if (n) {
    add('Clientes', clientes.filter(c => has(c.nombre + ' ' + c.tel + ' ' + (c.claveElector || ''))).map(c => ({ ic: 'clientes', t: c.nombre, s: `${c.tel} · saldo ${$m(resumenCliente(c.id).saldo)}`, run: `go('cliente',{clienteId:${c.id}})` })));
    add('Artículos', productos.filter(p => has(p.nombre + ' ' + p.sku + ' ' + p.cat)).map(p => ({ ic: 'catalogo', t: p.nombre, s: `${$m(p.precio)} · ${p.stock ? p.stock + ' en existencia' : 'agotado'}`, run: `go('catalogo');modalDetalle('${p.sku}')` })));
    add('Créditos y préstamos', [...creditos, ...prestamos].filter(x => has(x.id + ' ' + (x.producto || '') + ' ' + cliente(x.clienteId).nombre)).map(x => ({ ic: x.producto ? 'creditos' : 'prestamos', t: `${x.id} · ${cliente(x.clienteId).nombre}`, s: x.producto || `Préstamo ${$m(x.monto)}`, run: x.producto ? `go('cliente',{clienteId:${x.clienteId}})` : `go('prestamos');verCalendario('${x.id}')` })));
    add('Notas de cobro', notas.filter(nt => has(nt.folio + ' ' + cliente(nt.clienteId).nombre)).map(nt => ({ ic: 'cobranza', t: `Nota ${nt.folio}`, s: `${cliente(nt.clienteId).nombre} · ${$m(nt.total)}`, run: `verNota('${nt.folio}')` })));
  }
  add('Ir a', NAV.filter(([k, l]) => !n || has(l)).map(([k, l]) => ({ ic: k, t: l, s: 'Abrir módulo', run: `go('${k}')` })).slice(0, n ? 6 : 10));
  palItems = out.filter(x => permitido(x.run)); palSel = 0; pintarPal(q);
}
function pintarPal(q) {
  let g = '';
  document.getElementById('palRes').innerHTML = palItems.length ? palItems.map((x, i) => (x.grupo !== g ? `<div class="pal-grp">${(g = x.grupo)}</div>` : '') +
    `<button class="pal-it ${i === palSel ? 'on' : ''}" onmouseenter="palSel=${i};marcarPal()" onclick="ejecutarPal(${i})">${icono(x.ic)}<span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join('')
    : `<div class="empty">Sin resultados para “${esc(q)}”</div>`;
}
function marcarPal() { document.querySelectorAll('.pal-it').forEach((b, i) => b.classList.toggle('on', i === palSel)); }
function ejecutarPal(i) { const x = palItems[i]; if (!x) return; cerrarBuscador(); closeModal(); new Function(x.run)(); }
function palKey(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); palSel = (palSel + (e.key === 'ArrowDown' ? 1 : -1) + palItems.length) % palItems.length; marcarPal();
    document.querySelector('.pal-it.on')?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); ejecutarPal(palSel); }
}
document.addEventListener('keydown', e => {
  const escribiendo = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !escribiendo)) { e.preventDefault(); abrirBuscador(); }

try { guiaOculta = localStorage.getItem(GUIA_KEY) === '1'; } catch (e) { }
function ocultarGuia() { guiaOculta = true; try { localStorage.setItem(GUIA_KEY, '1'); } catch (e) { } render(); }
function inicioHTML() {
  const h = new Date().getHours(), saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const cs = todasCuotas(), venc = cs.filter(c => c.estado === 'Vencido'), prox = cs.filter(c => c.estado === 'Por vencer');
  const notasHoy = notas.filter(n => n.fecha === HOY), bajos = productos.filter(p => p.stock <= p.min);
  const nCli = a => new Set(a.map(c => c.clienteId)).size;
  const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
  const tareas = [
    ['bad', 'cobranza', pl(nCli(venc), 'cliente', 'clientes'), 'con pagos vencidos', $m(sum(venc, c => c.pendiente)) + ' por recuperar', 'Ver quiénes', "go('reportes',{repTab:'nopagados'})"],
    ['warn', 'estados', pl(prox.length, 'pago', 'pagos'), prox.length === 1 ? 'vence en los próximos 7 días' : 'vencen en los próximos 7 días', $m(sum(prox, c => c.pendiente)) + ' por cobrar', 'Ver agenda', "go('reportes',{repTab:'proximos'})"],
    ['ok', 'reportes', $m(sum(notasHoy, n => n.total)), 'cobrado hoy', `${notasHoy.length} nota${notasHoy.length === 1 ? '' : 's'} emitida${notasHoy.length === 1 ? '' : 's'}`, 'Ir a cobranza', "go('cobranza')"],
    [bajos.length ? 'warn' : 'ok', 'inventario', pl(bajos.length, 'artículo', 'artículos'), 'por resurtir', pl(bajos.filter(p => !p.stock).length, 'agotado', 'agotados'), 'Ver inventario', "go('inventario')"],
  ];
  const pasos = [
    ['Configura tu empresa', 'Logo, dirección y datos de las notas', !!(EMPRESA.logo || EMPRESA.rfc || EMPRESA.calle), "go('configuracion')"],
    ['Registra un cliente con su INE', 'Nombre, teléfono, domicilio y fotos', clientes.some(tieneINE), 'modalCliente()'],
    ['Haz una venta', 'Desde el catálogo, a crédito o de contado', creditos.some(c => c.fecha === HOY) || ventasContado.length > 0, "go('catalogo')"],
    ['Cobra y entrega la nota', 'En Cobranza eliges al cliente y cobras', notas.length > 0, "go('cobranza')"],
  ];
  const hechos = pasos.filter(p => p[2]).length;
  return `<div class="top"><div><h1>${saludo} 👋</h1><p>${D(HOY).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${esc(EMPRESA.sucursal)}</p></div></div>
    <h2 class="sec-t">Para hoy</h2>
    <div class="tareas">${tareas.map(([c, ic, n, l, s, cta, run]) => `<button class="tarea t-${c}" onclick="${run}"><span class="t-ic">${icono(ic)}</span><span class="t-txt"><b>${n}</b><span>${l}</span><small>${s}</small></span><span class="t-cta">${cta} →</span></button>`).join('')}</div>
    <h2 class="sec-t">¿Qué quieres hacer?</h2>
    <div class="rapidas">${[['cobranza', 'Cobrar', "go('cobranza')"], ['catalogo', 'Vender', "go('catalogo')"], ['prestamos', 'Prestar', 'modalPrestamo()'], ['clientes', 'Nuevo cliente', 'modalCliente()']].map(([ic, t, run]) => `<button class="rapida" onclick="${run}">${icono(ic)}<span>${t}</span></button>`).join('')}</div>
    ${guiaOculta || !puede('config') ? '' : `<div class="card guia"><div class="card-h"><div><h3>Primeros pasos</h3><span class="sub">${hechos} de ${pasos.length} completados</span></div><button class="btn sm ghost" onclick="ocultarGuia()">Ocultar guía</button></div>
      <div class="bar" style="margin:0 18px;"><i style="width:${hechos / pasos.length * 100}%"></i></div>
      <div class="pasos">${pasos.map(([t, s, ok, run], i) => `<button class="paso ${ok ? 'ok' : ''}" onclick="${run}"><span class="p-n">${ok ? '✓' : i + 1}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div></div>`}
    <h2 class="sec-t">Panorama del negocio</h2>`;
}

/* ============ Usuarios, roles e inicio de sesión ============ */
// Prototipo: los usuarios y la sesión viven en este navegador. En la versión final la validación se hará en el servidor.
// Cada usuario es Administrador (acceso total y gestión de usuarios) o tiene acceso solo a los módulos que el administrador le marque.
const MODULOS = [
  ['cobranza', 'Cobrar a clientes y entregar notas'], ['catalogo', 'Ver artículos y vender de contado o a crédito'], ['clientes', 'Consultar y registrar clientes con su INE'],
  ['creditos', 'Ventas a crédito'], ['prestamos', 'Otorgar y consultar préstamos'], ['estados', 'Cartera vencida y estados de cuenta'],
  ['reportes', 'Reportes de cobranza'], ['inventario', 'Existencias, artículos y entradas de mercancía'], ['configuracion', 'Datos de la empresa y de las notas'],
];
const PLANTILLAS = [['Vendedor', ['cobranza', 'catalogo', 'clientes', 'creditos', 'estados']], ['Cobrador', ['cobranza', 'clientes', 'estados']], ['Todos', MODULOS.map(m => m[0])], ['Ninguno', []]];
// Permiso que requiere cada acción del sistema, y qué módulos lo otorgan
const ACCION_PERMISO = { modalCredito: 'vender', modalContado: 'vender', modalPrestamo: 'prestar', modalCliente: 'clientes', modalINE: 'clientes', modalProducto: 'inventario', modalStock: 'inventario', quitarFoto: 'inventario', modalAbono: 'cobrar', confirmarCobro: 'cobrar', guardarCfg: 'config', restablecerCfg: 'config', modalUsuario: 'usuarios' };
const PERMISO_MODULOS = { cobrar: ['cobranza'], vender: ['catalogo', 'creditos'], clientes: ['clientes'], prestar: ['prestamos'], inventario: ['inventario'], config: ['configuracion'], usuarios: [] };
const USR_KEY = 'surtidora-usuarios', SES_KEY = 'surtidora-sesion';
let usuarios = [], usuario = null, claveForzada = false;

const esAdmin = (u = usuario) => u?.rol === 'admin';
const modulosDe = (u = usuario) => esAdmin(u) ? [...MODULOS.map(m => m[0]), 'usuarios'] : u?.modulos || [];
const tipoAcceso = (u = usuario) => esAdmin(u) ? 'Administrador' : `Acceso a ${u.modulos.length} módulo${u.modulos.length === 1 ? '' : 's'}`;
const puede = perm => esAdmin() || (PERMISO_MODULOS[perm] || []).some(m => modulosDe().includes(m));
const puedeVer = v => v === 'resumen' || modulosDe().includes(v === 'cliente' ? 'clientes' : v);
// ¿El usuario puede ejecutar este onclick? (revisa acciones protegidas y módulos a los que lleva)
const permitido = on => !Object.keys(ACCION_PERMISO).some(k => on.includes(k + '(') && !puede(ACCION_PERMISO[k])) && ![...on.matchAll(/go\('(\w+)'/g)].some(m => !puedeVer(m[1]));
function aplicarPermisos(root) {
  root?.querySelectorAll('button[onclick], a[onclick]').forEach(b => { if (!permitido(b.getAttribute('onclick'))) b.style.display = 'none'; });
}

function cargarUsuarios() {
  try { usuarios = JSON.parse(localStorage.getItem(USR_KEY) || '[]'); } catch (e) { usuarios = []; }
  usuarios.forEach(u => { if (u.rol !== 'admin' && !u.modulos) Object.assign(u, { rol: 'usuario', modulos: (PLANTILLAS.find(p => p[0].toLowerCase() === u.rol) || [, []])[1] }); });
}
function guardarUsuarios() { try { localStorage.setItem(USR_KEY, JSON.stringify(usuarios)); } catch (e) { toast('No se pudo guardar en este navegador'); } }
const nuevaSal = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, '0')).join('');
async function hashClave(clave, sal) {
  const txt = sal + ':' + clave;
  if (window.crypto?.subtle) return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))), x => x.toString(16).padStart(2, '0')).join('');
  let h = 2166136261; for (const ch of txt) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16);
}

// Sesión
function pintarLogin() {
  document.getElementById('loginBrand').innerHTML = `${logoHTML()}<div><b>${esc(EMPRESA.nombre)}</b><small>${esc(EMPRESA.eslogan)}</small></div>`;
  document.getElementById('lgHint').hidden = !(usuarios.length === 1 && usuarios[0].cambiarClave);
}
async function entrar(ev) {
  ev.preventDefault();
  const f = ev.target, err = document.getElementById('lgErr');
  const x = usuarios.find(u => u.usuario === f.usuario.value.trim().toLowerCase());
  if (!x || await hashClave(f.clave.value, x.sal) !== x.hash) { err.textContent = 'Usuario o contraseña incorrectos'; f.clave.value = ''; f.clave.focus(); return; }
  if (!x.activo) { err.textContent = 'Este usuario está desactivado. Pide acceso al administrador.'; return; }
  err.textContent = ''; f.reset();
  abrirSesion(x);
}
function abrirSesion(x) {
  usuario = x; try { sessionStorage.setItem(SES_KEY, x.id); } catch (e) { }
  x.ultimoAcceso = new Date().toISOString(); guardarUsuarios();
  document.body.classList.remove('locked');
  state.view = 'resumen'; render(); window.scrollTo(0, 0);
  if (x.cambiarClave) modalClave(true); else toast(`Hola, ${x.nombre.split(' ')[0]}`);
}
function salir() {
  claveForzada = false; closeModal(); cerrarBuscador(); cerrarNuevo(); cerrarMas();
  usuario = null; try { sessionStorage.removeItem(SES_KEY); } catch (e) { }
  pintarLogin(); document.body.classList.add('locked');
  setTimeout(() => document.getElementById('lgUser').focus(), 20);
}
async function iniciarSesion() {
  cargarUsuarios();
  if (!usuarios.length) {
    const sal = nuevaSal();
    usuarios.push({ id: 'U1', nombre: 'Administrador', usuario: 'admin', rol: 'admin', modulos: [], activo: true, cambiarClave: true, alta: HOY, sal, hash: await hashClave('admin123', sal) });
    guardarUsuarios();
  }
  let id = null; try { id = sessionStorage.getItem(SES_KEY); } catch (e) { }
  const x = usuarios.find(u => u.id === id && u.activo);
  if (x) abrirSesion(x); else salir();
}

function pintarUsuario() {
  if (!usuario) return;
  document.getElementById('sideFoot').innerHTML = `<div class="user-chip"><div class="avatar">${esc(iniciales(usuario.nombre))}</div><div class="grow"><b>${esc(usuario.nombre)}</b><span class="sub">${tipoAcceso()}</span></div></div>
    <div style="display:flex;gap:6px"><button class="btn sm" onclick="modalClave()">Contraseña</button><button class="btn sm" onclick="salir()">Salir</button></div>`;
  document.getElementById('userBtn').textContent = iniciales(usuario.nombre);
}
function menuUsuario() {
  openModal('Mi cuenta', `<div class="user-chip" style="margin-bottom:16px"><div class="avatar">${esc(iniciales(usuario.nombre))}</div><div class="grow"><b>${esc(usuario.nombre)}</b><span class="sub">${esc(usuario.usuario)} · ${tipoAcceso()}</span></div></div>
    <div style="display:grid;gap:8px">${puedeVer('usuarios') ? `<button type="button" class="btn" onclick="closeModal();go('usuarios')">Administrar usuarios</button>` : ''}
    <button type="button" class="btn" onclick="modalClave()">Cambiar contraseña</button><button type="button" class="btn" onclick="salir()">Cerrar sesión</button></div>`, null);
}
function modalClave(forzado) {
  openModal(forzado ? 'Crea tu contraseña' : 'Cambiar contraseña', `${forzado ? '<p class="muted" style="margin:0 0 14px">Estás usando una contraseña temporal. Crea una propia para continuar.</p>' : ''}<div class="fgrid">
    ${forzado ? '' : field('Contraseña actual', '<input class="input" type="password" name="actual" autocomplete="current-password" required>', true)}
    ${field('Nueva contraseña', '<input class="input" type="password" name="nueva" minlength="6" autocomplete="new-password" required>')}
    ${field('Repítela', '<input class="input" type="password" name="repite" minlength="6" autocomplete="new-password" required>')}
  </div>${forzado ? '<button type="button" class="btn sm ghost" style="margin:12px 0 0 -10px" onclick="salir()">Cerrar sesión</button>' : ''}`, d => { cambiarClave(d, forzado); return false; });
  if (forzado) { claveForzada = true; modal.querySelector('.x').remove(); modal.querySelector('.mfoot .btn:not(.pri)').remove(); }
}
async function cambiarClave(d, forzado) {
  if (!forzado && await hashClave(d.actual, usuario.sal) !== usuario.hash) return toast('La contraseña actual no es correcta');
  if (d.nueva !== d.repite) return toast('Las contraseñas no coinciden');
  if (await hashClave(d.nueva, usuario.sal) === usuario.hash) return toast('La nueva contraseña debe ser distinta a la anterior');
  usuario.sal = nuevaSal(); usuario.hash = await hashClave(d.nueva, usuario.sal); usuario.cambiarClave = false;
  guardarUsuarios(); claveForzada = false; closeModal(); render(); toast('Contraseña actualizada');
}

// Administración de usuarios (solo Administrador)
ICONS.usuarios = '<path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/>';
NAV.push(['usuarios', 'Usuarios']); NAV_LABEL.usuarios = 'Usuarios'; NAV_GRUPOS[2][1].push('usuarios');
VIEWS.usuarios = function () {
  const filas = [...usuarios].sort((a, b) => b.activo - a.activo || esAdmin(b) - esAdmin(a) || a.nombre.localeCompare(b.nombre));
  const estado = u => !u.activo ? '<span class="badge b-bad">Desactivado</span>' : u.cambiarClave ? '<span class="badge b-warn">Contraseña temporal</span>' : '<span class="badge b-ok">Activo</span>';
  const acceso = u => esAdmin(u) ? '<span class="badge b-brand">Administrador · todo</span>'
    : u.modulos.length ? `<div class="mod-chips">${['resumen', ...u.modulos].map(m => `<span class="badge b-mut">${NAV_LABEL[m]}</span>`).join('')}</div>` : '<span class="muted">Solo Inicio</span>';
  return header('Usuarios', 'Solo el administrador crea usuarios y decide a qué módulos entra cada quien', `<button class="btn pri" onclick="modalUsuario()">+ Nuevo usuario</button>`) +
    `<div class="grid">
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Puede entrar a</th><th>Estado</th><th class="hide-xs">Último acceso</th><th></th></tr></thead><tbody>
    ${filas.map(u => `<tr><td><b>${esc(u.nombre)}</b><span class="sub">${esc(u.usuario)}${u.id === usuario.id ? ' · tú' : ''}</span></td><td>${acceso(u)}</td><td>${estado(u)}</td>
      <td class="hide-xs">${u.ultimoAcceso ? new Date(u.ultimoAcceso).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : '<span class="muted">Nunca</span>'}</td><td class="num"><button class="btn sm" onclick="modalUsuario('${u.id}')">Editar</button></td></tr>`).join('')}
    </tbody></table></div></div>
    <p class="muted" style="font-size:12px;margin:0 4px">Todos ven Inicio. Vender requiere Catálogo o Créditos; registrar clientes requiere Clientes. Vista previa: los usuarios se guardan en este navegador; en la versión final se guardarán en el servidor.</p></div>`;
};
function modalUsuario(id) {
  const u = usuarios.find(x => x.id === id), yo = u?.id === usuario.id, admin = u ? esAdmin(u) : false, mods = u?.modulos || [];
  openModal(u ? 'Editar usuario' : 'Nuevo usuario', `<div class="fgrid">
    ${field('Nombre completo', `<input class="input" name="nombre" value="${esc(u?.nombre || '')}" required>`)}
    ${field('Usuario para entrar', `<input class="input" name="usuario" value="${esc(u?.usuario || '')}" required pattern="[a-zA-Z0-9._\\-]{3,20}" title="De 3 a 20 letras, números, punto o guion" autocapitalize="none" autocomplete="off">`)}
    ${field(u ? 'Nueva contraseña temporal (opcional)' : 'Contraseña temporal', `<input class="input" name="clave" minlength="6" autocomplete="off" ${u ? 'placeholder="Déjala vacía para no cambiarla"' : 'required'}>`, true)}
    ${u && !yo ? `<label class="cfg-check full"><input type="checkbox" name="activo" ${u.activo ? 'checked' : ''}> Usuario activo (puede iniciar sesión)</label>` : ''}
    <div class="field full"><label>Tipo de acceso</label>${yo ? '<input type="hidden" name="tipo" value="admin"><p class="muted" style="margin:0;font-size:12.5px">Eres administrador; no puedes quitarte ese acceso.</p>' : `<div class="seg">
      <label><input type="radio" name="tipo" value="modulos" ${admin ? '' : 'checked'}><span>Elegir módulos</span></label>
      <label><input type="radio" name="tipo" value="admin" ${admin ? 'checked' : ''}><span>Administrador</span></label></div>`}</div>
    <div class="field full" id="modsBox"><label>Módulos a los que puede entrar <span style="font-weight:500">· Inicio siempre está disponible</span></label>
      <div class="mod-plant">Rápido: ${PLANTILLAS.map(([n], i) => `<button type="button" class="btn sm" onclick="marcarModulos(${i})">${n}</button>`).join('')}</div>
      <div class="mod-grid">${MODULOS.map(([k, d]) => `<label class="mod-opt"><input type="checkbox" name="mod" value="${k}" ${mods.includes(k) ? 'checked' : ''}>${icono(k)}<span><b>${NAV_LABEL[k]}</b><small>${d}</small></span></label>`).join('')}</div></div>
    <p class="muted full" id="adminNota" style="grid-column:1/-1;margin:0;font-size:12.5px">El administrador entra a todos los módulos y es el único que crea y gestiona usuarios.</p>
  </div><p class="muted" style="font-size:12px;margin:12px 0 0">Entrégale la contraseña temporal en persona; se le pedirá cambiarla la primera vez que entre.</p>`,
    d => { guardarUsuario(u, d); return false; }, d => { const ad = d.tipo === 'admin'; document.getElementById('modsBox').hidden = ad; document.getElementById('adminNota').hidden = !ad; }, true);
}
function marcarModulos(i) { const sel = PLANTILLAS[i][1]; document.querySelectorAll('#mf input[name=mod]').forEach(c => c.checked = sel.includes(c.value)); }
async function guardarUsuario(u, d) {
  const login = d.usuario.trim().toLowerCase(), yo = u?.id === usuario.id;
  if (usuarios.some(x => x.usuario === login && x !== u)) return toast('Ese nombre de usuario ya existe');
  const rol = yo ? u.rol : d.tipo === 'admin' ? 'admin' : 'usuario', activo = !u || yo || !!d.activo;
  const modulos = rol === 'admin' ? [] : [...document.querySelectorAll('#mf input[name=mod]:checked')].map(c => c.value);
  if (rol !== 'admin' && !modulos.length && !confirm('No marcaste ningún módulo: solo podrá ver Inicio. ¿Guardar así?')) return;
  if (u && esAdmin(u) && (rol !== 'admin' || !activo) && usuarios.filter(x => esAdmin(x) && x.activo).length === 1) return toast('Debe quedar al menos un administrador activo');
  const x = u || { id: 'U' + Date.now().toString(36), alta: HOY };
  Object.assign(x, { nombre: d.nombre.trim(), usuario: login, rol, modulos, activo });
  if (d.clave) { x.sal = nuevaSal(); x.hash = await hashClave(d.clave, x.sal); x.cambiarClave = !yo; }
  if (!u) usuarios.push(x);
  guardarUsuarios(); closeModal(); render(); toast(u ? 'Usuario actualizado' : `Usuario “${login}” creado`);
}

// Aplica los permisos a la navegación, las vistas, los modales y las acciones protegidas
Object.entries(ACCION_PERMISO).forEach(([fn, perm]) => {
  const f = window[fn];
  window[fn] = function (...a) { if (!puede(perm)) { a[0]?.preventDefault?.(); toast('Tu usuario no tiene permiso para esta acción'); return; } return f.apply(this, a); };
});
const goBase = go, renderBase = render, openModalBase = openModal, closeModalBase = closeModal;
go = function (view, extra) { if (!puedeVer(view)) return toast('Tu usuario no tiene acceso a esta sección'); goBase(view, extra); };
render = function () {
  if (!usuario) return;
  if (!puedeVer(state.view)) state.view = 'resumen';
  renderBase(); aplicarPermisos(document.getElementById('main')); pintarUsuario();
};
openModal = function (...a) { openModalBase(...a); aplicarPermisos(modal); };
closeModal = function () { if (!claveForzada) closeModalBase(); };

aplicarMarca();
iniciarSesion();
</script>
