<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surtidora Emmanuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#14161b;--muted:#6b7280;--line:#e5e7eb;--soft:#f8f9fb;
  --brand:#0f766e;--brand-2:#115e59;--brand-soft:#e3f3f1;
  --warn:#a16207;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--ok:#15803d;--ok-soft:#dcfce7;
  --side:#0f1720;--side-ink:#aab4c3;--radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;color:#fff}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-weight:700}
.logo b{display:block;font-size:15px;letter-spacing:-.01em}
.logo small{font-size:11px;color:var(--side-ink)}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;border:0;background:none;color:var(--side-ink);text-align:left;width:100%;font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:#1b2531;color:#fff}
.nav.on{background:#1f2b38;color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid #1f2933;font-size:12px}
.side-foot b{color:#fff;display:block;font-weight:600}
/* Main */
.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#cfd3da}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.two{grid-template-columns:1.6fr 1fr}
.twoeq{grid-template-columns:1fr 1fr}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.sub{display:block;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-mut{background:#eef0f3;color:#4b5563}
.b-brand{background:var(--brand-soft);color:var(--brand-2)}
.bar{height:7px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.warn i{background:#d97706}.bar.bad i{background:var(--bad)}
/* toolbar */
.toolbar{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.input{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel);min-width:0}
.input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.search{flex:1;min-width:180px}
.tabs{display:flex;gap:4px;background:#eceef2;padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
@media (max-width:560px){.chart{gap:4px}.col small{font-size:9.5px;letter-spacing:-.02em;white-space:nowrap}}
.col .stack{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.col .s1{background:var(--brand)}.col .s2{background:#5eead4}
.col small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--brand-soft);color:var(--brand-2)}
.avatar.lg{width:64px;height:64px;font-size:22px}
/* clients grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{padding:16px;cursor:pointer;transition:border-color .15s}
.ccard:hover{border-color:var(--brand)}
.ccard-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.ccard-top b{display:block}
.kv{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.kv span{color:var(--muted)}
/* profile */
.profile{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile h2{margin:0;font-size:20px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.score{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,32,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .card-h{padding:16px 20px}
.modal form{padding:18px 20px 20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.preview{margin-top:16px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
.preview .kv{margin-top:4px}
.alert{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:12.5px;font-weight:500}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:500;opacity:0;transform:translateY(10px);transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ec-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.ec-sum{display:flex;gap:26px;flex-wrap:wrap}
.ec-sum div span{display:block;font-size:12px;color:var(--muted)}
.ec-sum div b{font-size:18px;font-variant-numeric:tabular-nums}
.pos{color:var(--bad)}.neg{color:var(--ok)}
/* catálogo */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.pcard{overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:#cfd3da;box-shadow:0 6px 20px rgba(15,23,32,.07)}
.pimg{aspect-ratio:4/3;position:relative;cursor:pointer;border-bottom:1px solid var(--line)}
.pimg img,.pimg .ilus{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.ilus svg{width:52%;height:auto;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pimg .badge{position:absolute;top:10px;left:10px}
.pimg.out{filter:grayscale(1);opacity:.6}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pbody .cat{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pbody h4{margin:0;font-size:15px;line-height:1.3}
.price{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.desde{font-size:13px;color:var(--brand-2);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{font-size:11.5px;padding:4px 8px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.pbtns{display:flex;gap:8px;margin-top:auto}
.pbtns .btn{flex:1;justify-content:center}
.thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb img,.thumb .ilus{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.thumb .ilus svg{width:70%;stroke-width:5}
.prod-cell{display:flex;align-items:center;gap:12px}
.modal.wide{max-width:820px}
.detalle{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.detalle .pimg{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:default}
.modal th,.modal td{padding:9px 10px}
.plan-box{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.plan-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#planes{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;border-collapse:separate;border-spacing:0}
#planes .input{width:100%;max-width:84px;padding:6px 9px}
.plan-row td:first-child{white-space:nowrap}
.fprev{width:100%;aspect-ratio:4/3;border:1px dashed #cfd3da;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.fprev img,.fprev .ilus{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.detalle>*,.fgrid>*{min-width:0}
.field .input{width:100%}
@media (max-width:700px){.detalle{grid-template-columns:1fr}.pimg{aspect-ratio:16/10}.modal form{padding:16px}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.twoeq{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:4px;z-index:20}
  #nav{display:flex;gap:4px}
  .logo{padding:0 8px 0 0}.logo div:last-child,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .nav.on{box-shadow:inset 0 -3px 0 var(--brand)}
  .main{padding:18px 16px 50px}
  .fgrid{grid-template-columns:1fr}
}
/* cobranza */
.cob-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.cob-list{max-height:560px;overflow:auto}
.row.click{cursor:pointer}.row.click:hover{background:var(--soft)}
.row.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.cob-row{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
.cob-row.off{opacity:.5}
.cob-row .grow{flex:1;min-width:0}
.cob-chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick .chip{cursor:pointer}.quick .chip:hover{border-color:var(--brand);color:var(--brand-2)}
.cob-monto{display:flex;align-items:center;gap:6px}
.cob-monto .input{width:120px;text-align:right;font-weight:600}
.cob-foot{padding:16px 18px;background:var(--soft);border-radius:0 0 var(--radius) var(--radius)}
.cob-total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
#cobTotal{font-size:26px;letter-spacing:-.02em;display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* nota de cobro */
.nota{max-width:420px;margin:0 auto;padding:18px;font-size:13px;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.nota-h{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:2px solid #111}
.nota-h b{font-size:16px;display:block}.nota-h span{font-size:11.5px;color:#555}
.nota-t{display:flex;justify-content:space-between;margin:12px 0 10px;font-size:14px;letter-spacing:.04em}
.nota-kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.nota-kv span{color:#555}
.nota-tbl{margin:12px 0;border-top:1px dashed #999;border-bottom:1px dashed #999}
.nota-tbl th{background:none;padding:6px 4px;font-size:10.5px}.nota-tbl td{padding:6px 4px;border-bottom:1px dotted #ddd;font-size:12px}
.nota-tot{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 8px}.nota-tot b{font-size:20px}
.nota-sep{border-top:1px dashed #999;margin:8px 0}
.nota-firma{margin:34px auto 0;text-align:center;font-size:11.5px;color:#555;width:70%}.nota-firma span{display:block;border-top:1px solid #111;margin-bottom:4px}
.nota-pie{text-align:center;font-size:11px;color:#777;margin:16px 0 0}
#printArea{display:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
/* clientes en lista */
.vista-tog .tab{display:inline-flex;align-items:center;gap:6px}.vista-tog svg{width:15px;height:15px}
.tab-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.07);font-size:11px;margin-left:3px}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--ink)}
.sort-ic{margin-left:5px;font-size:10px;opacity:.55}th[aria-sort="ascending"] .sort-ic,th[aria-sort="descending"] .sort-ic{opacity:1;color:var(--brand)}
.cli-tbl td{padding:10px 14px}
@media (max-width:820px){.hide-sm{display:none}}
@media (max-width:560px){.hide-xs{display:none}.cli-tbl .avatar{display:none}.cli-tbl td,.cli-tbl th{padding:10px 8px}
  .toolbar .tabs{overflow-x:auto;flex-wrap:nowrap;max-width:100%}.toolbar .tab{white-space:nowrap}}
/* ===== Experiencia de uso ===== */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:700;padding:14px 12px 5px}
.nav span{flex:1}
.nav-badge{font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center}
.nav-badge.bad{background:#dc2626;color:#fff}.nav-badge.warn{background:#f59e0b;color:#1f1300}
.side{overflow-y:auto}
.topbar{display:flex;align-items:center;gap:12px;margin:-6px 0 20px}
.top-brand{display:none}
.search-btn{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);cursor:text;text-align:left}
.search-btn:hover{border-color:#cfd3da}.search-btn svg{width:17px;height:17px;flex:none}.search-btn span{flex:1}
kbd{font:600 11px Inter,sans-serif;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;color:var(--muted)}
.nuevo-wrap{position:relative;margin-left:auto}
.nuevo-menu{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(15,23,32,.16);padding:6px;display:none;z-index:40}
.nuevo-menu.show{display:block}
.nuevo-menu button,.pal-it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer}
.nuevo-menu button:hover,.pal-it.on{background:var(--brand-soft)}
.nuevo-menu svg,.pal-it svg{width:20px;height:20px;color:var(--brand);flex:none}
.nuevo-menu b,.pal-it b{display:block;font-size:13.5px}.nuevo-menu small,.pal-it small{display:block;color:var(--muted);font-size:12px}
.pal-ov,.sheet-ov{position:fixed;inset:0;background:rgba(15,23,32,.45);display:none;z-index:70;padding:10vh 16px 16px;justify-content:center;align-items:flex-start}
.pal-ov.show,.sheet-ov.show{display:flex}
.pal{background:var(--panel);width:100%;max-width:600px;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:20px;height:20px;color:var(--muted)}.pal-in input{flex:1;border:0;outline:0;font-size:16px;background:none}
#palRes{max-height:55vh;overflow:auto;padding:6px}
.pal-grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.pal-foot{font-size:11.5px;color:var(--muted);padding:9px 16px;border-top:1px solid var(--line);background:var(--soft)}
.help{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#e5e7eb;color:#4b5563;font-size:10.5px;font-weight:700;cursor:help;position:relative;vertical-align:1px;margin-left:3px;text-transform:none;letter-spacing:0}
.help:hover::after,.help:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:240px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:90;white-space:normal;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.tareas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tarea{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;border-left:4px solid var(--c);transition:transform .12s,box-shadow .12s}
.tarea:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,32,.08)}
.t-bad{--c:var(--bad);--cs:var(--bad-soft)}.t-warn{--c:#d97706;--cs:var(--warn-soft)}.t-ok{--c:var(--ok);--cs:var(--ok-soft)}
.t-ic{width:36px;height:36px;border-radius:10px;background:var(--cs);color:var(--c);display:grid;place-items:center}.t-ic svg{width:20px;height:20px}
.t-txt b{display:block;font-size:20px;letter-spacing:-.02em}.t-txt span{display:block;font-size:13px}.t-txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* ============ Cálculos ============ */
function credCalc(c) {
  const total = c.precio * c.cant;
  const financiado = (total - c.enganche) * (1 + c.recargo);
  const freq = c.freq || 'semanal', dias = freq === 'quincenal' ? 15 : 7;
  const nPagos = pagosCredito(c.semanas, freq);
  const abono = Math.ceil(financiado / nPagos);
  const pagado = sum(c.abonos, a => a.monto);
  const saldo = Math.max(0, financiado - pagado);
  const hechos = Math.min(nPagos, Math.floor(pagado / abono + 1e-6));
  const prox = addDays(c.fecha, dias * (hechos + 1));
  const liquidado = saldo < 1;
  const atraso = liquidado ? 0 : Math.max(0, diffDays(HOY, prox));
  const estado = liquidado ? 'Liquidado' : atraso > 0 ? 'Atrasado' : 'Al corriente';
  return { total, financiado, abono, nPagos, freq, dias, pagado, saldo, hechos, prox, atraso, estado, liquidado };
}
function presCalc(p) {
  // El interés es mensual: el plazo se convierte a meses (4 semanas o 2 quincenas = 1 mes)
  const nPagos = p.plazo;
  const meses = p.plazo / FREQ[p.freq].porMes;
  const intereses = p.monto * p.tasa * meses;
  const totalPagar = p.monto + intereses;
  const pago = Math.ceil(totalPagar / nPagos);
  const pagado = sum(p.abonos, a => a.monto);
  const saldo = Math.max(0, totalPagar - pagado);
  const hechos = Math.min(nPagos, Math.floor(pagado / pago + 1e-6));
  const prox = addDays(p.fecha, FREQ[p.freq].dias * (hechos + 1));
  const liquidado = saldo < 1;
  const atraso = liquidado ? 0 : Math.max(0, diffDays(HOY, prox));
  const estado = liquidado ? 'Liquidado' : atraso > 0 ? 'Atrasado' : 'Al corriente';
  return { nPagos, meses, intereses, totalPagar, pago, pagado, saldo, hechos, prox, atraso, estado, liquidado };
}

}

ICONS.reportes = '<path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/>';
ICONS.cobranza = '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v.01M18 14.5v.01"/>';
const NAV = [['resumen', 'Inicio'], ['cobranza', 'Cobranza'], ['catalogo', 'Catálogo'], ['clientes', 'Clientes'], ['estados', 'Estados de cuenta'], ['reportes', 'Reportes'], ['inventario', 'Inventario'], ['creditos', 'Créditos'], ['prestamos', 'Préstamos'], ['configuracion', 'Configuración']];
const state = { view: 'resumen', clienteId: null, ecCliente: 1, ecPeriodo: 'todo', q: '', cat: 'Todas', filtro: 'Activos', soloDisp: false, orden: 'relevancia', cobCliente: null, cobSolo: null, cobFiltro: 'Todos',
  ecTab: 'global', calMes: HOY.slice(0, 7), calDia: HOY, f: { tipo: 'Todos', freq: 'Todas', estado: 'Todos' },
  rango: { desde: HOY.slice(0, 8) + '01', hasta: HOY, quick: 'mes' }, repTab: 'pagados', proxDias: 7, atrasoMin: 0,
  cliVista: 'lista', cliFiltro: 'Todos', cliOrden: { k: 'nombre', dir: 1 } };

function go(view, extra = {}) {
  if (view === 'estados') extra = { ecTab: extra.ecCliente ? 'cliente' : 'global', ...extra }; Object.assign(state, { q: '', filtro: 'Activos', cat: 'Todas', soloDisp: false, cobSolo: null }, extra, { view }); render(); window.scrollTo(0, 0); }
function render() {
  renderNav();
  document.getElementById('main').innerHTML = VIEWS[state.view]();
  if (document.getElementById('cobBtn')) actualizarCobro();
  if (document.getElementById('cfg')) previewCfg();
  const s = document.getElementById('q');
  if (s && state.q) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
const setQ = v => { state.q = v; render(); };
function ordenarClientes(k) { state.cliOrden = { k, dir: state.cliOrden.k === k ? -state.cliOrden.dir : (k === 'nombre' || k === 'score' ? 1 : -1) }; render(); }
const header = (t, p, actions = '') => `<div class="top"><div><h1>${t}</h1><p>${p}</p></div><div class="actions">${actions}</div></div>`;

/* ============ Vistas ============ */
const VIEWS = {
  resumen() {
    const cr = creditos.map(c => ({ ...c, ...credCalc(c) })), pr = prestamos.map(p => ({ ...p, ...presCalc(p) }));
    const crAct = cr.filter(c => !c.liquidado), prAct = pr.filter(p => !p.liquidado);
    const vencidos = [...crAct, ...prAct].filter(x => x.atraso > 0);
    const valorInv = sum(productos, p => p.costo * p.stock);
    // Cobranza por semana (últimas 8)
    const semanas = Array.from({ length: 8 }, (_, i) => addDays(HOY, -7 * (7 - i)));
    const bucket = (arr) => semanas.map(ini => sum(arr.flatMap(x => x.abonos).filter(a => a.fecha > addDays(ini, -7) && a.fecha <= ini), a => a.monto));
    const bc = bucket(creditos), bp = bucket(prestamos);
    const max = Math.max(...semanas.map((_, i) => bc[i] + bp[i]), 1);
    const hoyCobro = [...crAct.map(c => ({ ...c, tipo: 'Crédito', cuota: c.abono })), ...prAct.map(p => ({ ...p, tipo: 'Préstamo', cuota: p.pago }))]
      .filter(x => diffDays(x.prox, HOY) <= 7).sort((a, b) => a.prox.localeCompare(b.prox));
    const bajos = productos.filter(p => p.stock <= p.min).sort((a, b) => a.stock - b.stock);
    return inicioHTML() +
      `<div class="grid kpis">
        <div class="card kpi"><span>Cartera de créditos</span><b>${$m(sum(crAct, c => c.saldo))}</b><small>${crAct.length} créditos activos</small></div>
        <div class="card kpi"><span>Préstamos por cobrar</span><b>${$m(sum(prAct, p => p.saldo))}</b><small>${prAct.length} préstamos activos</small></div>
        <div class="card kpi"><span>Pagos atrasados</span><b style="color:var(--bad)">${vencidos.length}</b><small>${$m(sum(vencidos, x => (x.abono || x.pago) * Math.ceil(x.atraso / (x.dias || FREQ[x.freq].dias))))} aprox. vencido</small></div>
        <div class="card kpi"><span>Inventario (a costo)</span><b>${$m(valorInv)}</b><small>${sum(productos, p => p.stock)} piezas · ${bajos.length} por resurtir</small></div>
      </div>
      <div class="grid two" style="margin-top:16px">
        <div class="card"><div class="card-h"><h3>Cobranza semanal</h3><div class="legend"><span><i style="background:var(--brand)"></i>Créditos</span><span><i style="background:#5eead4"></i>Préstamos</span></div></div>
          <div class="card-b"><div class="chart">${semanas.map((s, i) => `<div class="col" title="${$m(bc[i] + bp[i])}"><small>${$m(bc[i] + bp[i]).replace('.00', '').replace('$', '$')}</small><div class="stack"><div class="s1" style="height:${bc[i] / max * 130}px"></div><div class="s2" style="height:${bp[i] / max * 130}px"></div></div><small>${D(s).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }).replace('.', '')}</small></div>`).join('')}</div></div></div>
        <div class="card"><div class="card-h"><h3>Por resurtir</h3><button class="btn sm ghost" onclick="go('inventario')">Ver inventario →</button></div>
          ${bajos.map(p => `<div class="row"><div class="grow"><b>${p.nombre}</b><span class="sub">${p.sku} · mínimo ${p.min}</span></div>${p.stock === 0 ? '<span class="badge b-bad">Agotado</span>' : `<span class="badge b-warn">${p.stock} pzas</span>`}</div>`).join('')}
        </div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-h"><h3>Cobros de esta semana y atrasados</h3><span class="muted">${hoyCobro.length} pendientes</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Folio</th><th>Tipo</th><th>Fecha de pago</th><th class="num">Cuota</th><th>Estado</th><th></th></tr></thead><tbody>
        ${hoyCobro.map(x => `<tr class="click" onclick="go('cliente',{clienteId:${x.clienteId}})"><td><b>${esc(cliente(x.clienteId).nombre)}</b></td><td>${x.id}</td><td>${x.tipo}</td><td>${fdate(x.prox)}${x.atraso ? `<span class="sub" style="color:var(--bad)">${x.atraso} días de atraso</span>` : ''}</td><td class="num">${$m(x.cuota)}</td><td>${estadoBadge(x.estado)}</td><td class="num"><button class="btn sm" onclick="event.stopPropagation();modalAbono('${x.id}')">Cobrar</button></td></tr>`).join('')}
        </tbody></table></div></div>`;
  },

  catalogo() {
    const q = state.q.toLowerCase(), cats = ['Todas', ...new Set(productos.map(p => p.cat))];
    let list = productos.filter(p => (state.cat === 'Todas' || p.cat === state.cat) && (!state.soloDisp || p.stock > 0) && (!q || (p.nombre + p.sku + p.desc).toLowerCase().includes(q)));
    if (state.orden === 'menor') list = list.slice().sort((a, b) => a.precio - b.precio);
    if (state.orden === 'mayor') list = list.slice().sort((a, b) => b.precio - a.precio);
    if (state.orden === 'relevancia') list = list.slice().sort((a, b) => (b.stock > 0) - (a.stock > 0));
    const disp = productos.filter(p => p.stock > 0).length;
    return header('Catálogo de venta', `${productos.length} artículos · ${disp} disponibles · planes de financiamiento por artículo`,
      `<button class="btn" onclick="go('inventario')">Ver inventario</button><button class="btn pri" onclick="modalProducto()">+ Nuevo artículo</button>`) +
      `<div class="card" style="margin-bottom:16px"><div class="toolbar" style="border:0">
        <input id="q" class="input search" placeholder="Buscar artículo…" value="${esc(state.q)}" oninput="setQ(this.value)">
        <select class="input" aria-label="Categoría" onchange="state.cat=this.value;render()">${cats.map(c => `<option ${c === state.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <select class="input" aria-label="Ordenar por" onchange="state.orden=this.value;render()">${[['relevancia', 'Disponibles primero'], ['menor', 'Menor precio'], ['mayor', 'Mayor precio']].map(([k, l]) => `<option value="${k}" ${state.orden === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <div class="tabs"><button class="tab ${!state.soloDisp ? 'on' : ''}" onclick="state.soloDisp=false;render()">Todos</button><button class="tab ${state.soloDisp ? 'on' : ''}" onclick="state.soloDisp=true;render()">Solo disponibles</button></div>
      </div></div>
      <div class="pgrid">${list.map(p => {
        const planes = resumenPlanes(p).map(pl => planCalc(p, pl));
        const minimo = p.planes.length ? Math.min(...p.planes.map(pl => planCalc(p, pl).abono)) : 0;
        const agotado = p.stock === 0;
        return `<div class="card pcard">
          <div class="pimg ${agotado ? 'out' : ''}" onclick="modalDetalle('${p.sku}')">${fotoHTML(p)}${agotado ? '<span class="badge b-bad">Agotado</span>' : p.stock <= p.min ? `<span class="badge b-warn">Últimas ${p.stock} pzas</span>` : ''}</div>
          <div class="pbody">
            <span class="cat">${esc(p.cat)}</span>
            <h4>${esc(p.nombre)}</h4>
            <div class="price">${$m(p.precio)}</div>
            ${p.planes.length ? `<span class="desde">o desde ${$m(minimo)} semanales*</span>` : '<span class="desde muted">Solo contado</span>'}
            <div class="chips">${planes.map(pl => `<span class="chip">${pl.semanas} sem · <b>${$m(pl.abono)}</b></span>`).join('')}</div>
            <div class="pbtns">${agotado
              ? `<button class="btn" onclick="modalStock('${p.sku}')">Resurtir</button><button class="btn" onclick="modalDetalle('${p.sku}')">Ver planes</button>`
              : `<button class="btn" onclick="modalDetalle('${p.sku}')">Ver planes</button><button class="btn pri" onclick="${p.planes.length ? `modalCredito(null,'${p.sku}')` : `modalContado('${p.sku}')`}">Vender</button>`}</div>
          </div>
        </div>`;
      }).join('') || '<div class="empty card">Sin resultados</div>'}</div>
      <p class="muted" style="font-size:12px;margin-top:14px">* Abono semanal con el enganche sugerido de cada artículo; también se puede pagar quincenal. Los plazos, recargos y enganche se configuran al crear o editar el artículo.</p>`;
  },

  cobranza() {
    const q = state.q.toLowerCase();
    const lista = clientes.map(c => {
      const cuentas = cuentasCliente(c.id);
      const r = resumenCliente(c.id);
      const prox = cuentas.map(x => x.k.prox).sort()[0];
      return { c, cuentas, r, prox, vencido: sum(cuentas, x => x.vencido), cuota: sum(cuentas, x => x.cuotaReal) };
    }).filter(x => x.cuentas.length);
    const semana = addDays(HOY, 7);
    const filtrada = lista.filter(x => (state.cobFiltro === 'Todos' || (state.cobFiltro === 'Atrasados' ? x.vencido > 0 : x.prox <= semana)) && (!q || (x.c.nombre + x.c.tel).toLowerCase().includes(q)))
      .sort((a, b) => b.vencido - a.vencido || a.prox.localeCompare(b.prox));
    const notasHoy = notas.filter(n => n.fecha === HOY);
    const sel = lista.find(x => x.c.id === state.cobCliente);
    return header('Cobranza', `Cobro de abonos y pagos · ${fdate(HOY)}`) +
      `<div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><span>Por cobrar esta semana</span><b>${$m(sum(lista.filter(x => x.prox <= semana), x => x.cuota))}</b><small>${lista.filter(x => x.prox <= semana).length} clientes</small></div>
        <div class="card kpi"><span>Vencido</span><b style="color:var(--bad)">${$m(sum(lista, x => x.vencido))}</b><small>${lista.filter(x => x.vencido).length} clientes atrasados</small></div>
        <div class="card kpi"><span>Cobrado hoy</span><b style="color:var(--ok)">${$m(sum(notasHoy, n => n.total))}</b><small>${notasHoy.length} notas emitidas</small></div>
        <div class="card kpi"><span>Efectivo en caja (hoy)</span><b>${$m(sum(notasHoy.filter(n => n.forma === 'Efectivo'), n => n.total))}</b><small>sin transferencias ni tarjeta</small></div>
      </div>
      <div class="grid cob-grid">
        <div class="card" style="align-self:start"><div class="toolbar">
          <input id="q" class="input search" placeholder="Buscar cliente…" value="${esc(state.q)}" oninput="setQ(this.value)">
          <div class="tabs">${['Todos', 'Atrasados', 'Esta semana'].map(f => `<button class="tab ${state.cobFiltro === f ? 'on' : ''}" onclick="state.cobFiltro='${f}';render()">${f}</button>`).join('')}</div></div>
          <div class="cob-list">${filtrada.map(x => `<div class="row click ${x.c.id === state.cobCliente ? 'sel' : ''}" onclick="state.cobCliente=${x.c.id};state.cobSolo=null;render()">
            <div class="avatar">${initials(x.c.nombre)}</div>
            <div class="grow"><b>${esc(x.c.nombre)}</b><span class="sub">${x.cuentas.length} cuenta${x.cuentas.length > 1 ? 's' : ''} · próximo ${fdate(x.prox)}</span></div>
            <div style="text-align:right">${x.vencido ? `<span class="badge b-bad">${$m(x.vencido)}</span><span class="sub">vencido</span>` : `<b class="num">${$m(x.cuota)}</b><span class="sub">cuota</span>`}</div></div>`).join('') || '<div class="empty">No hay clientes con ese filtro</div>'}</div>
        </div>
        <div class="card" id="cobro" style="align-self:start">${sel ? panelCobro(sel) : '<div class="empty" style="padding:60px 20px">Selecciona un cliente para registrar su cobro</div>'}</div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-h"><h3>Notas de cobro</h3><span class="muted">${notas.length} emitidas</span></div>
        ${notas.length ? `<div class="tbl-wrap"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Cuentas</th><th>Forma</th><th class="num">Total</th><th></th></tr></thead><tbody>
        ${notas.map(n => `<tr><td><b>${n.folio}</b></td><td>${fdate(n.fecha)}<span class="sub">${n.hora}</span></td><td>${esc(cliente(n.clienteId).nombre)}</td><td>${n.lineas.map(l => l.ref).join(', ')}</td><td>${n.forma}</td><td class="num"><b>${$m(n.total)}</b></td><td class="num" style="white-space:nowrap"><button class="btn sm" onclick="verNota('${n.folio}')">Ver</button> <button class="btn sm" onclick="imprimirNota('${n.folio}')">Imprimir</button></td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">Aún no hay cobros registrados. Las notas aparecerán aquí.</div>'}</div>`;
  },

  clientes() {
    const q = norm(state.q);
    const filas = clientes.map(c => ({ c, r: resumenCliente(c.id) })).map(x => ({ ...x, uso: pct(x.r.saldoCred, x.c.limite), ine: tieneINE(x.c) }));
    const cuenta = { Todos: filas.length, 'Con atraso': filas.filter(x => x.r.atrasos.length).length, 'Al corriente': filas.filter(x => !x.r.atrasos.length && x.r.saldo).length, 'Sin saldo': filas.filter(x => !x.r.saldo).length, 'Sin INE': filas.filter(x => !x.ine).length };
    const pasa = { Todos: () => true, 'Con atraso': x => x.r.atrasos.length, 'Al corriente': x => !x.r.atrasos.length && x.r.saldo, 'Sin saldo': x => !x.r.saldo, 'Sin INE': x => !x.ine }[state.cliFiltro];
    const orden = { nombre: (a, b) => a.c.nombre.localeCompare(b.c.nombre), saldo: (a, b) => a.r.saldo - b.r.saldo, uso: (a, b) => a.uso - b.uso, atraso: (a, b) => a.r.maxAtraso - b.r.maxAtraso, score: (a, b) => a.r.score.localeCompare(b.r.score) }[state.cliOrden.k];
    const list = filas.filter(x => pasa(x) && (!q || norm(x.c.nombre + ' ' + x.c.tel + ' ' + x.c.dir).includes(q))).sort((a, b) => orden(a, b) * state.cliOrden.dir);
    const estado = r => r.atrasos.length ? `<span class="badge b-bad">${r.maxAtraso} días atraso</span>` : r.saldo ? '<span class="badge b-ok">Al corriente</span>' : '<span class="badge b-mut">Sin saldo</span>';
    const th = (k, l, cls = '') => `<th class="sortable ${cls}" onclick="ordenarClientes('${k}')" aria-sort="${state.cliOrden.k === k ? (state.cliOrden.dir > 0 ? 'ascending' : 'descending') : 'none'}">${l}<span class="sort-ic">${state.cliOrden.k === k ? (state.cliOrden.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`;
    const vistaLista = `<div class="card"><div class="tbl-wrap"><table class="cli-tbl"><thead><tr>
        ${th('nombre', 'Cliente')}${th('score', 'Calif.')}${th('uso', 'Crédito usado', 'hide-sm')}<th class="num hide-sm">Préstamos</th>${th('saldo', 'Saldo total', 'num')}${th('atraso', 'Estado')}<th class="hide-sm">INE</th><th class="hide-xs"></th></tr></thead><tbody>
      ${list.map(({ c, r, uso, ine }) => `<tr class="click" onclick="go('cliente',{clienteId:${c.id}})">
        <td><div class="prod-cell"><div class="avatar">${initials(c.nombre)}</div><div><b>${esc(c.nombre)}</b><span class="sub">${esc(c.tel)}<span class="hide-xs"> · ${esc(c.ocupacion)}</span></span></div></div></td>
        <td><span class="score" style="${scoreStyle(r.score)};width:30px;height:30px;font-size:13px">${r.score}</span></td>
        <td class="hide-sm" style="min-width:170px"><div class="bar ${uso > 85 ? 'bad' : uso > 60 ? 'warn' : ''}"><i style="width:${uso}%"></i></div><span class="sub">${$m(r.saldoCred)} de ${$m(c.limite)}</span></td>
        <td class="num hide-sm">${r.saldoPres ? $m(r.saldoPres) : '<span class="muted">—</span>'}</td>
        <td class="num"><b>${$m(r.saldo)}</b></td>
        <td>${estado(r)}</td>
        <td class="hide-sm">${ine ? '<span class="badge b-ok">✓ Completa</span>' : `<button class="btn sm" onclick="event.stopPropagation();modalINE(${c.id})">Subir INE</button>`}</td>
        <td class="num hide-xs" style="white-space:nowrap">${r.saldo ? `<button class="btn sm" onclick="event.stopPropagation();go('cobranza',{cobCliente:${c.id}})">Cobrar</button> ` : ''}<button class="btn sm ghost" aria-label="Ver ${esc(c.nombre)}">Ver →</button></td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">Sin clientes con esos filtros</td></tr>'}
      </tbody></table></div></div>`;
    const vistaTarjetas = `<div class="cgrid">${list.map(({ c, r, uso, ine }) => `<div class="card ccard" onclick="go('cliente',{clienteId:${c.id}})">
          <div class="ccard-top"><div class="avatar">${initials(c.nombre)}</div><div style="flex:1;min-width:0"><b>${esc(c.nombre)}</b><span class="sub">${esc(c.tel)} · ${esc(c.ocupacion)}</span></div><div class="score" style="${scoreStyle(r.score)};width:32px;height:32px;font-size:14px">${r.score}</div></div>
          <div class="kv"><span>Crédito usado</span><b>${$m(r.saldoCred)} / ${$m(c.limite)}</b></div>
          <div class="bar ${uso > 85 ? 'bad' : uso > 60 ? 'warn' : ''}" style="margin:6px 0 4px"><i style="width:${uso}%"></i></div>
          <div class="kv"><span>Préstamos</span><b>${$m(r.saldoPres)}</b></div>
          ${ine ? '' : '<div class="kv"><span>Identificación</span><span class="badge b-warn">Sin INE</span></div>'}
          <div class="kv"><span>Estado</span>${estado(r)}</div>
        </div>`).join('') || '<div class="empty card">Sin clientes con esos filtros</div>'}</div>`;
    return header('Clientes', `${clientes.length} clientes registrados · calificación ${ayuda('A = siempre al corriente · B = atraso de hasta 14 días · C = atraso mayor a 14 días.')}`, `<button class="btn pri" onclick="modalCliente()">+ Nuevo cliente</button>`) +
      `<div class="card" style="margin-bottom:16px"><div class="toolbar" style="border:0">
        <input id="q" class="input search" placeholder="Buscar por nombre, teléfono o dirección…" value="${esc(state.q)}" oninput="setQ(this.value)">
        <div class="tabs" role="group" aria-label="Filtrar clientes">${Object.keys(cuenta).map(k => `<button class="tab ${state.cliFiltro === k ? 'on' : ''}" onclick="state.cliFiltro='${k}';render()">${k} <span class="tab-n">${cuenta[k]}</span></button>`).join('')}</div>
        <div class="tabs vista-tog" role="group" aria-label="Tipo de vista">
          <button class="tab ${state.cliVista === 'lista' ? 'on' : ''}" onclick="state.cliVista='lista';render()" aria-pressed="${state.cliVista === 'lista'}" title="Ver como lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lista</button>
          <button class="tab ${state.cliVista === 'tarjetas' ? 'on' : ''}" onclick="state.cliVista='tarjetas';render()" aria-pressed="${state.cliVista === 'tarjetas'}" title="Ver como tarjetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Tarjetas</button>
        </div>
      </div></div>
      ${state.cliVista === 'lista' ? vistaLista : vistaTarjetas}
      <p class="muted" style="font-size:12px;margin:10px 2px">Mostrando ${list.length} de ${clientes.length} clientes${state.cliVista === 'lista' ? ' · haz clic en un encabezado para ordenar' : ''}.</p>`;
  },

  cliente() {
    const c = cliente(state.clienteId), r = resumenCliente(c.id), uso = pct(r.saldoCred, c.limite);
    const mov = movimientos(c.id).slice().reverse().slice(0, 6);
    return `<button class="btn sm ghost no-print" style="margin:-6px 0 10px -10px" onclick="go('clientes')">← Clientes</button>` +
      `<div class="card card-b" style="margin-bottom:16px"><div class="profile">
        <div class="avatar lg">${initials(c.nombre)}</div>
        <div style="flex:1;min-width:220px"><h2>${esc(c.nombre)}</h2><span class="muted">Cliente desde ${fdate(c.alta)} · ${esc(c.ocupacion)}</span></div>
        <div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><span class="sub">Calificación ${ayuda('A = siempre al corriente · B = atraso de hasta 14 días · C = atraso mayor a 14 días.')}</span><b>${r.score === 'A' ? 'Excelente' : r.score === 'B' ? 'Regular' : 'Riesgo'}</b></div><div class="score" style="${scoreStyle(r.score)}">${r.score}</div></div>
        <div class="actions" style="width:100%"><button class="btn pri" onclick="modalCredito(${c.id})">+ Venta a crédito</button><button class="btn" onclick="modalPrestamo(${c.id})">+ Préstamo</button><button class="btn" onclick="go('cobranza',{cobCliente:${c.id}})">Cobrar</button><button class="btn" onclick="go('estados',{ecCliente:${c.id}})">Ver estado de cuenta</button></div>
      </div></div>
      <div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><span>Saldo total</span><b>${$m(r.saldo)}</b><small>créditos + préstamos</small></div>
        <div class="card kpi"><span>Límite de crédito</span><b>${$m(c.limite)}</b><div class="bar ${uso > 85 ? 'bad' : uso > 60 ? 'warn' : ''}" style="margin-top:6px"><i style="width:${uso}%"></i></div></div>
        <div class="card kpi"><span>Disponible</span><b style="color:var(--ok)">${$m(Math.max(0, c.limite - r.saldoCred))}</b><small>para nuevas compras</small></div>
        <div class="card kpi"><span>Atraso máximo</span><b style="color:${r.maxAtraso ? 'var(--bad)' : 'inherit'}">${r.maxAtraso} días</b><small>${r.atrasos.length} cuenta(s) atrasada(s)</small></div>
      </div>
      <div class="grid two">
        <div class="grid" style="align-content:start">
          <div class="card"><div class="card-h"><h3>Créditos</h3><span class="muted">${r.cr.length}</span></div>${tablaCreditos(r.cr, false)}</div>
          <div class="card"><div class="card-h"><h3>Préstamos</h3><span class="muted">${r.pr.length}</span></div>${tablaPrestamos(r.pr, false)}</div>
        </div>
        <div class="grid" style="align-content:start">
          <div class="card"><div class="card-h"><h3>Datos del cliente</h3></div><div class="card-b"><dl class="dl">
            <dt>Teléfono</dt><dd>${esc(c.tel)}</dd><dt>Domicilio</dt><dd>${esc(c.dir)}</dd><dt>Ocupación</dt><dd>${esc(c.ocupacion)}</dd><dt>Referencia</dt><dd>${esc(c.ref)}</dd><dt>Alta</dt><dd>${fdate(c.alta)}</dd>
          </dl></div></div>
          <div class="card"><div class="card-h"><h3>Identificación (INE)</h3>${tieneINE(c) ? '<span class="badge b-ok">Completa</span>' : '<span class="badge b-warn">Pendiente</span>'}</div><div class="card-b">
            ${tieneINE(c)
              ? `<div class="ine-mini">${['frente', 'reverso'].map(l => `<button type="button" onclick="verINE(${c.id})"><img src="${c.ine[l]}" alt="INE ${l}"><span>${l === 'frente' ? 'Frente' : 'Reverso'}</span></button>`).join('')}</div>
                 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="sub">${c.claveElector ? 'Clave ' + esc(c.claveElector) + ' · ' : ''}cargada ${fdate(c.ine.fecha)}</span><button class="btn sm ghost" onclick="modalINE(${c.id})">Actualizar</button></div>`
              : `<p class="muted" style="margin:0 0 12px">Este cliente no tiene su INE en el expediente.</p><button class="btn pri sm" onclick="modalINE(${c.id})">Subir INE</button>`}
          </div></div>
          <div class="card"><div class="card-h"><h3>Últimos movimientos</h3></div>
            ${mov.map(m => `<div class="row"><div class="grow"><b style="font-weight:500">${esc(m.concepto)}</b><span class="sub">${fdate(m.fecha)} · ${m.ref}</span></div><b class="${m.cargo ? 'pos' : 'neg'} num">${m.cargo ? '+' + $m(m.cargo) : '−' + $m(m.abono)}</b></div>`).join('') || '<div class="empty">Sin movimientos</div>'}
          </div>
        </div>
      </div>`;
  },

  estados() {
    const c = cliente(state.ecCliente), r = resumenCliente(c.id);
    const desde = { todo: '0000', '90': addDays(HOY, -90), anio: '2026-01-01' }[state.ecPeriodo];
    const all = movimientos(c.id);
    const inicial = all.filter(m => m.fecha < desde).reduce((s, m) => m.saldo, 0);
    const mov = all.filter(m => m.fecha >= desde);
    return `<div class="card"><div class="toolbar">
        <select class="input" style="flex:1;min-width:200px" onchange="state.ecCliente=+this.value;render()">${clientes.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
        <div class="tabs">${[['todo', 'Todo'], ['anio', '2026'], ['90', 'Últimos 90 días']].map(([k, l]) => `<button class="tab ${state.ecPeriodo === k ? 'on' : ''}" onclick="state.ecPeriodo='${k}';render()">${l}</button>`).join('')}</div>
      </div>
      <div class="card-b print-only nota-h membrete">${encabezadoEmpresa()}<div style="margin-left:auto;text-align:right"><b>ESTADO DE CUENTA</b><span>Corte al ${fdate(HOY)}</span></div></div>
      <div class="card-b ec-head" style="border-bottom:1px solid var(--line)">

        <div class="ec-sum">
          <div><span>Saldo inicial</span><b>${$m(inicial)}</b></div>
          <div><span>Cargos</span><b class="pos">${$m(sum(mov, m => m.cargo))}</b></div>
          <div><span>Abonos</span><b class="neg">${$m(sum(mov, m => m.abono))}</b></div>
          <div><span>Saldo actual</span><b>${$m(r.saldo)}</b></div>
        </div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Folio</th><th>Concepto</th><th class="num">Cargo</th><th class="num">Abono</th><th class="num">Saldo</th></tr></thead><tbody>
        ${mov.map(m => `<tr><td style="white-space:nowrap">${fdate(m.fecha)}</td><td><span class="badge ${m.ref.startsWith('CR') ? 'b-brand' : 'b-mut'}">${m.ref}</span></td><td>${esc(m.concepto)}</td><td class="num pos">${m.cargo ? $m(m.cargo) : ''}</td><td class="num neg">${m.abono ? $m(m.abono) : ''}</td><td class="num"><b>${$m(m.saldo)}</b></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin movimientos en el periodo</td></tr>'}
      </tbody></table></div></div>`;
  },

  inventario() {
    const q = state.q.toLowerCase(), cats = ['Todas', ...new Set(productos.map(p => p.cat))];
    const list = productos.filter(p => (state.cat === 'Todas' || p.cat === state.cat) && (!q || (p.nombre + p.sku).toLowerCase().includes(q)));
    return header('Inventario', `${productos.length} productos · ${sum(productos, p => p.stock)} piezas en tienda`, `<button class="btn pri" onclick="modalProducto()">+ Nuevo producto</button>`) +
      `<div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><span>Valor a costo</span><b>${$m(sum(productos, p => p.costo * p.stock))}</b></div>
        <div class="card kpi"><span>Valor a precio de venta</span><b>${$m(sum(productos, p => p.precio * p.stock))}</b></div>
        <div class="card kpi"><span>Stock bajo</span><b style="color:var(--warn)">${productos.filter(p => p.stock && p.stock <= p.min).length}</b></div>
        <div class="card kpi"><span>Agotados</span><b style="color:var(--bad)">${productos.filter(p => !p.stock).length}</b></div>
      </div>
      <div class="card"><div class="toolbar">
        <input id="q" class="input search" placeholder="Buscar producto o SKU…" value="${esc(state.q)}" oninput="setQ(this.value)">
        <select class="input" aria-label="Categoría" onchange="state.cat=this.value;render()">${cats.map(c => `<option ${c === state.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Margen</th><th class="num">Existencia</th><th>Estado</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr><td><div class="prod-cell"><div class="thumb">${fotoHTML(p)}</div><div><b>${esc(p.nombre)}</b><span class="sub">${esc(p.sku)}</span></div></div></td><td>${esc(p.cat)}</td><td class="num">${$m(p.costo)}</td><td class="num">${$m(p.precio)}</td><td class="num">${Math.round((p.precio - p.costo) / p.precio * 100)}%</td><td class="num"><b>${p.stock}</b> <span class="muted">/ mín ${p.min}</span></td><td>${stockBadge(p)}</td><td class="num" style="white-space:nowrap"><button class="btn sm" onclick="modalProducto('${p.sku}')">Editar</button> <button class="btn sm" onclick="modalStock('${p.sku}')">Existencia</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">Sin resultados</td></tr>'}
      </tbody></table></div></div>`;
  },

  creditos() {
    const all = creditos.map(c => ({ ...c, ...credCalc(c) }));
    const list = filtrar(all);
    const act = all.filter(c => !c.liquidado);
    return header('Créditos', 'Ventas de productos a plazos con abonos semanales o quincenales', `<button class="btn pri" onclick="modalCredito()">+ Venta a crédito</button>`) +
      `<div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><span>Saldo por cobrar</span><b>${$m(sum(act, c => c.saldo))}</b><small>${act.length} activos</small></div>
        <div class="card kpi"><span>Cobrado a la fecha</span><b>${$m(sum(all, c => c.pagado + c.enganche))}</b><small>incluye enganches</small></div>
        <div class="card kpi"><span>Cobranza esperada por semana</span><b>${$m(sum(act, c => c.abono * 7 / c.dias))}</b><small>${act.filter(c => c.freq === 'quincenal').length} quincenales · ${act.filter(c => c.freq !== 'quincenal').length} semanales</small></div>
        <div class="card kpi"><span>Atrasados</span><b style="color:var(--bad)">${act.filter(c => c.atraso).length}</b><small>${$m(sum(act.filter(c => c.atraso), c => c.saldo))} en riesgo</small></div>
      </div>
      <div class="card">${toolbarFiltro('Buscar cliente, folio o producto…')}${tablaCreditos(list, true)}</div>`;
  },

  prestamos() {
    const all = prestamos.map(p => ({ ...p, ...presCalc(p) }));
    const list = filtrar(all);
    const act = all.filter(p => !p.liquidado);
    return header('Préstamos', 'Préstamos en efectivo con interés simple mensual', `<button class="btn pri" onclick="modalPrestamo()">+ Nuevo préstamo</button>`) +
      `<div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><span>Capital prestado (activos)</span><b>${$m(sum(act, p => p.monto))}</b><small>${act.length} activos</small></div>
        <div class="card kpi"><span>Saldo por cobrar</span><b>${$m(sum(act, p => p.saldo))}</b></div>
        <div class="card kpi"><span>Intereses generados</span><b style="color:var(--ok)">${$m(sum(all, p => p.intereses))}</b><small>total cartera</small></div>
        <div class="card kpi"><span>Atrasados</span><b style="color:var(--bad)">${act.filter(p => p.atraso).length}</b><small>${$m(sum(act.filter(p => p.atraso), p => p.saldo))} en riesgo</small></div>
      </div>
      <div class="card">${toolbarFiltro('Buscar cliente o folio…')}${tablaPrestamos(list, true)}</div>`;
  },
};

function panelCobro({ c, cuentas, r }) {
  const solo = state.cobSolo;
  return `<div class="card-h"><div class="prod-cell"><div class="avatar">${initials(c.nombre)}</div><div><h3>${esc(c.nombre)}</h3><span class="sub">${esc(c.tel)} · saldo total ${$m(r.saldo)}</span></div></div>
    <button class="btn sm ghost" onclick="go('estados',{ecCliente:${c.id}})">Estado de cuenta →</button></div>
    <div oninput="actualizarCobro()" onchange="actualizarCobro()">
    ${cuentas.map(x => {
      const inc = !solo || solo === x.x.id;
      return `<div class="cob-row ${inc ? '' : 'off'}" data-id="${x.x.id}">
      <label class="cob-chk"><input type="checkbox" data-inc ${inc ? 'checked' : ''}></label>
      <div class="grow"><b>${x.x.id}</b> <span class="badge ${x.tipo === 'Crédito' ? 'b-brand' : 'b-mut'}">${x.tipo}</span>${x.vencido ? ` <span class="badge b-bad">${x.k.atraso} días atraso</span>` : ''}
        <span class="sub">${esc(x.desc)} · cuota ${x.periodo} ${$m(x.cuota)} · saldo ${$m(x.k.saldo)}</span>
        <div class="quick"><button type="button" class="chip" onclick="montoRapido(this,${x.cuotaReal.toFixed(2)})">Cuota ${$m(x.cuotaReal)}</button>${x.vencido > x.cuotaReal ? `<button type="button" class="chip" onclick="montoRapido(this,${x.vencido.toFixed(2)})">Vencido ${$m(x.vencido)}</button>` : ''}<button type="button" class="chip" onclick="montoRapido(this,${x.k.saldo.toFixed(2)})">Liquidar ${$m(x.k.saldo)}</button></div></div>
      <div class="cob-monto"><span class="muted">$</span><input class="input" type="number" min="0" step="0.01" max="${x.k.saldo.toFixed(2)}" aria-label="Monto a cobrar de ${x.x.id}" data-monto value="${x.sugerido.toFixed(2)}"></div>
    </div>`;
    }).join('')}
    <div class="cob-foot">
      <div class="fgrid">
        ${field('Forma de pago', '<select class="input" id="cobForma"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select>')}
        <div class="field" id="cobEfectivo"><label>Efectivo recibido</label><input class="input" type="number" id="cobRecibido" min="0" step="0.01" placeholder="Opcional"></div>
      </div>
      <div class="cob-total"><div><span class="sub">Total a cobrar</span><b id="cobTotal">$0.00</b><span class="sub" id="cobCambio"></span></div>
        <button class="btn pri" id="cobBtn" onclick="confirmarCobro(${c.id})">Cobrar y generar nota</button></div>
    </div></div>`;
}

function filtrar(all) {
  const q = state.q.toLowerCase();
  return all.filter(x => {
    const f = state.filtro;
    if (f === 'Activos' && x.liquidado) return false;
    if (f === 'Atrasados' && !x.atraso) return false;
    if (f === 'Liquidados' && !x.liquidado) return false;
    return !q || (cliente(x.clienteId).nombre + x.id + (x.producto || '')).toLowerCase().includes(q);
  });
}
const toolbarFiltro = ph => `<div class="toolbar"><input id="q" class="input search" placeholder="${ph}" value="${esc(state.q)}" oninput="setQ(this.value)">
  <div class="tabs">${['Activos', 'Atrasados', 'Liquidados', 'Todos'].map(f => `<button class="tab ${state.filtro === f ? 'on' : ''}" onclick="state.filtro='${f}';render()">${f}</button>`).join('')}</div></div>`;

function tablaCreditos(list, conCliente) {
  if (!list.length) return '<div class="empty">Sin créditos</div>';
  return `<div class="tbl-wrap"><table><thead><tr><th>Folio</th>${conCliente ? '<th>Cliente</th>' : ''}<th>Producto</th><th class="num">Abono</th><th>Avance</th><th class="num">Saldo</th><th>Próximo pago</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(c => `<tr class="click" onclick="go('cliente',{clienteId:${c.clienteId}})"><td><b>${c.id}</b><span class="sub">${fdate(c.fecha)}</span></td>${conCliente ? `<td>${esc(cliente(c.clienteId).nombre)}</td>` : ''}<td>${esc(c.producto)}<span class="sub">Precio ${$m(c.total)} · eng. ${$m(c.enganche)}</span></td><td class="num">${$m(c.abono)}<span class="sub">${c.freq}</span></td>
    <td><div class="bar ${c.atraso ? 'bad' : ''}"><i style="width:${pct(c.pagado, c.financiado)}%"></i></div><span class="sub">${c.hechos}/${c.nPagos} abonos</span></td>
    <td class="num"><b>${$m(c.saldo)}</b></td><td>${c.liquidado ? '—' : fdate(c.prox)}${c.atraso ? `<span class="sub" style="color:var(--bad)">${c.atraso} días atraso</span>` : ''}</td><td>${estadoBadge(c.estado)}</td>
    <td class="num">${c.liquidado ? '' : `<button class="btn sm" onclick="event.stopPropagation();modalAbono('${c.id}')">Abonar</button>`}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function tablaPrestamos(list, conCliente) {
  if (!list.length) return '<div class="empty">Sin préstamos</div>';
  return `<div class="tbl-wrap"><table><thead><tr><th>Folio</th>${conCliente ? '<th>Cliente</th>' : ''}<th class="num">Capital</th><th>Condiciones</th><th class="num">Pago</th><th>Avance</th><th class="num">Saldo</th><th>Próximo pago</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(p => `<tr class="click" onclick="go('cliente',{clienteId:${p.clienteId}})"><td><b>${p.id}</b><span class="sub">${fdate(p.fecha)}</span></td>${conCliente ? `<td>${esc(cliente(p.clienteId).nombre)}</td>` : ''}<td class="num">${$m(p.monto)}</td><td>${(p.tasa * 100).toFixed(0)}% mensual<span class="sub">${p.plazo} ${UNIDAD[p.freq][p.plazo === 1 ? 0 : 1]} · ${p.freq}</span></td><td class="num">${$m(p.pago)}</td>
    <td><div class="bar ${p.atraso ? 'bad' : ''}"><i style="width:${pct(p.pagado, p.totalPagar)}%"></i></div><span class="sub">${p.hechos}/${p.nPagos} pagos</span></td>
    <td class="num"><b>${$m(p.saldo)}</b><span class="sub">de ${$m(p.totalPagar)}</span></td><td>${p.liquidado ? '—' : fdate(p.prox)}${p.atraso ? `<span class="sub" style="color:var(--bad)">${p.atraso} días atraso</span>` : ''}</td><td>${estadoBadge(p.estado)}</td>
    <td class="num" style="white-space:nowrap"><button class="btn sm" onclick="event.stopPropagation();verCalendario('${p.id}')">Calendario</button>${p.liquidado ? '' : ` <button class="btn sm" onclick="event.stopPropagation();modalAbono('${p.id}')">Cobrar</button>`}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ============ Modales ============ */
const overlay = document.getElementById('overlay'), modal = document.getElementById('modal');
function openModal(title, body, onSubmit, onInput, wide) {
  modal.className = 'modal' + (wide ? ' wide' : '');
  modal.innerHTML = `<div class="card-h"><h3>${title}</h3><button class="x" onclick="closeModal()" aria-label="Cerrar">×</button></div><form id="mf">${body}<div class="mfoot">${onSubmit ? '<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="mok">Guardar</button>' : '<button type="button" class="btn" onclick="closeModal()">Cerrar</button>'}</div></form>`;
  overlay.classList.add('show');
  const f = document.getElementById('mf');
  f.onsubmit = e => { e.preventDefault(); if (!onSubmit) return; const d = Object.fromEntries(new FormData(f)); if (onSubmit(d) !== false) { closeModal(); render(); } };
  if (onInput) { f.oninput = () => onInput(Object.fromEntries(new FormData(f))); onInput(Object.fromEntries(new FormData(f))); }
  f.querySelector('input,select')?.focus();
}
function closeModal() { overlay.classList.remove('show'); }
overlay.onclick = e => { if (e.target === overlay) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
const field = (label, html, full) => `<div class="field ${full ? 'full' : ''}"><label>${label}</label>${html}</div>`;
const optClientes = sel => clientes.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
const nextFolio = (arr, pre) => pre + '-' + String(Math.max(...arr.map(x => +x.id.split('-')[1])) + 1).padStart(4, '0');

/* ============ INE del cliente ============ */
let ineTmp = { frente: null, reverso: null };
const tieneINE = c => !!(c.ine && c.ine.frente && c.ine.reverso);

// Reduce la foto (las de celular pesan varios MB) a máx. 1400 px en JPG
function leerINE(input, lado) {
  const f = input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { toast('Selecciona una imagen'); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      ineTmp[lado] = cv.toDataURL('image/jpeg', 0.85);
      pintarINE(lado);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function pintarINE(lado) {
  const el = document.getElementById('ine-' + lado);
  el.classList.toggle('ok', !!ineTmp[lado]);
  el.querySelector('.ine-prev').innerHTML = ineTmp[lado]
    ? `<img src="${ineTmp[lado]}" alt="INE ${lado}"><span class="badge b-ok">Cargada</span>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2.2"/><path d="M5 16c.6-1.5 1.7-2.2 3-2.2s2.4.7 3 2.2M14 10h5M14 13h4"/></svg><b>${lado === 'frente' ? 'Frente' : 'Reverso'} de la INE</b><span>Toca para tomar foto o subir imagen</span>`;
}
const camposINE = () => `<div class="field full"><label>Identificación oficial (INE) · frente y reverso</label>
  <div class="ine-grid">${['frente', 'reverso'].map(l => `<label class="ine-tile" id="ine-${l}"><div class="ine-prev"></div><input type="file" accept="image/*" hidden onchange="leerINE(this,'${l}')"></label>`).join('')}</div>
  <span class="sub">Verifica que la foto sea legible: nombre, domicilio y vigencia.</span></div>`;

function verINE(id) {
  const c = cliente(id);
  openModal(`INE · ${esc(c.nombre)}`, `<div class="ine-ver">${['frente', 'reverso'].map(l => `<figure><img src="${c.ine[l]}" alt="INE ${l}"><figcaption>${l === 'frente' ? 'Frente' : 'Reverso'}</figcaption></figure>`).join('')}</div>
    ${c.claveElector ? `<div class="kv" style="margin-top:12px"><span>Clave de elector</span><b>${esc(c.claveElector)}</b></div>` : ''}
    <div class="kv"><span>Cargada el</span><b>${fdate(c.ine.fecha)}</b></div>
    <button type="button" class="btn" style="margin-top:14px" onclick="modalINE(${id})">Actualizar INE</button>`, null, null, true);
}
function modalINE(id) {
  const c = cliente(id);
  ineTmp = { frente: c.ine?.frente || null, reverso: c.ine?.reverso || null };
  openModal(`${tieneINE(c) ? 'Actualizar' : 'Subir'} INE · ${esc(c.nombre)}`, `<div class="fgrid">${camposINE()}
    ${field('Clave de elector (opcional)', `<input class="input" name="claveElector" maxlength="18" style="text-transform:uppercase" value="${esc(c.claveElector || '')}">`, true)}</div>`, d => {
    if (!ineTmp.frente || !ineTmp.reverso) { toast('Faltan fotos: sube frente y reverso de la INE'); return false; }
    c.ine = { ...ineTmp, fecha: HOY }; c.claveElector = d.claveElector.toUpperCase();
    toast('INE guardada en el expediente del cliente');
  }, null, true);
  pintarINE('frente'); pintarINE('reverso');
}

function modalCliente() {
  ineTmp = { frente: null, reverso: null };
  openModal('Nuevo cliente', `<div class="fgrid">
    ${field('Nombre completo', '<input class="input" name="nombre" required>', true)}
    ${field('Teléfono', '<input class="input" name="tel" required>')}
    ${field('Ocupación', '<input class="input" name="ocupacion">')}
    ${field('Domicilio', '<input class="input" name="dir" required>', true)}
    ${field('Referencia (nombre y teléfono)', '<input class="input" name="ref">', true)}
    ${field('Límite de crédito', '<input class="input" type="number" name="limite" value="10000" min="0" step="0.01">')}
    ${field('Clave de elector (opcional)', '<input class="input" name="claveElector" maxlength="18" style="text-transform:uppercase">')}
    ${camposINE()}
  </div>`, d => {
    if (!ineTmp.frente || !ineTmp.reverso) { toast('Falta la INE: sube frente y reverso para registrar al cliente'); return false; }
    const id = Math.max(...clientes.map(c => c.id)) + 1;
    clientes.push({ id, nombre: d.nombre.trim(), tel: d.tel, dir: d.dir, ocupacion: d.ocupacion || '—', ref: d.ref || '—', limite: +d.limite, alta: HOY, claveElector: d.claveElector.toUpperCase(), ine: { ...ineTmp, fecha: HOY } });
    toast('Cliente registrado con su INE'); state.view = 'cliente'; state.clienteId = id;
